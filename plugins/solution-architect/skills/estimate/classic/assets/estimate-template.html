<!doctype html>
<!-- data-theme is stated rather than left to the browser: this page opens dark,
     and the toggle flips from a known state so its first click always bites. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive project estimate with a scored price range">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f766e'/%3E%3C/svg%3E">
<title><!-- slot:TITLE --> — Estimate</title>
<style>
<!-- slot:FONTS -->
/* color-scheme is declared, not left at `normal`: a page that never states its
   scheme is the page a force-dark browser rewrites, and then the toggle flips
   data-theme with nothing visible changing — the button reads as broken. Stated
   per theme, forced dark is off and the native controls (the breakdown's
   selects and buttons) follow the page instead of fighting it.

   The light palette is unconditional and the dark one is scoped to @media screen
   below, so this block doubles as the paper palette: the page opens dark on a
   display, and printing it falls back here instead of spending a full-bleed page
   of ink. Written as a fallback rather than as a second copy inside @media print
   — a duplicated palette is a palette that drifts. */
:root {
  color-scheme:light;
  --bg:#f7f5f0; --ink:#1c1b18; --ink-dim:#6f6a5e;
  --accent:#0f766e; --accent-ink:#0b5a54; --accent-soft:rgba(15,118,110,.08);
  --warn:#b45309; --warn-soft:rgba(180,83,9,.1);
  --bad:#b91c1c; --ok:#15803d; --card:#fffdf9;
  --border:#e6e1d5; --border-strong:#cfc8b8;
  --shadow:0 1px 2px rgba(60,55,40,.05), 0 6px 20px rgba(60,55,40,.05);
}
@media screen {
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#101413; --ink:#e8e6e1; --ink-dim:#93a09b;
    --accent:#3ba99f; --accent-ink:#6fd1c7; --accent-soft:rgba(59,169,159,.12);
    --warn:#d98b3d; --warn-soft:rgba(217,139,61,.12);
    --bad:#e5726b; --ok:#5dbb7a; --card:#181d1c;
    --border:#263230; --border-strong:#3a4a46;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
body {
  font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink);
  margin:0; line-height:1.5;
}
button {
  font-family:inherit; font-size:.8rem; padding:.35rem .75rem; border-radius:.35rem;
  border:1px solid var(--border-strong); background:var(--card); color:var(--ink); cursor:pointer;
  transition:background-color .15s ease, border-color .15s ease, transform .1s ease;
}
button:hover { border-color:var(--accent); color:var(--accent-ink); }
button:active { transform:translateY(1px); }
/* companion-mode back-link to the arch-docs viewer; dressed as a header button */
#viewer-link {
  font-size:.8rem; padding:.35rem .75rem; border-radius:.35rem;
  border:1px solid var(--border-strong); color:var(--ink); text-decoration:none;
}
#viewer-link:hover { border-color:var(--accent); color:var(--accent-ink); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
/* header bar: constrained to the same column as main via padding math */
header {
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:.6rem;
  padding:.8rem max(1.25rem, calc((100% - 1160px) / 2));
  border-bottom:1px solid var(--border); background:var(--card);
}
.titles { flex:1; min-width:0; }
.eyebrow {
  margin:0; font-family:'IBM Plex Mono',monospace; font-size:.62rem;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim);
}
header h1 {
  font-size:1.05rem; font-weight:600; letter-spacing:-.01em; margin:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#confidence-badge {
  font-family:'IBM Plex Mono',monospace; font-size:.72rem; text-transform:uppercase;
  padding:.18rem .5rem; border-radius:.3rem; border:1px solid var(--border-strong);
}
#confidence-badge.high { color:var(--ok); border-color:var(--ok); background:rgba(21,128,61,.08); }
#confidence-badge.med { color:var(--warn); border-color:var(--warn); background:var(--warn-soft); }
#confidence-badge.low { color:var(--bad); border-color:var(--bad); background:rgba(185,28,28,.08); }
main {
  display:grid; grid-template-columns:1fr; gap:1.1rem;
  max-width:1160px; margin:0 auto; padding:1.25rem 1.25rem 3rem;
}
.col { display:grid; gap:1.1rem; min-width:0; align-content:start; }
.col > section:empty { display:none; }
main section h2, main aside h2 {
  font-size:.82rem; font-weight:600; color:var(--ink-dim);
  margin:0 0 .8rem; letter-spacing:.01em;
}
/* panels: every section reads as one surface */
.col > section {
  background:var(--card); border:1px solid var(--border); border-radius:.6rem;
  padding:1.1rem 1.2rem; box-shadow:var(--shadow);
}
.sec-head { display:flex; align-items:center; gap:.45rem; margin:0 0 .8rem; }
.sec-head h2 { margin:0; }
/* summary: the estimate's headline — the presented price range stated once,
   then the working behind it as small tables (internal view only). */
#summary .lead { font-size:1.02rem; font-weight:600; margin:0 0 .25rem; }
#summary .figures {
  font-size:1.7rem; font-weight:600; letter-spacing:-.02em; line-height:1.15;
  font-variant-numeric:tabular-nums; margin:0 0 .4rem;
}
#summary .sep { color:var(--ink-dim); margin:0 .4rem; font-weight:400; }
#summary .range, #summary .meta {
  margin:.15rem 0; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--ink-dim);
}
#summary .working { margin-top:.9rem; padding-top:.7rem; border-top:1px solid var(--border); }
#summary .working caption {
  text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-dim); margin-bottom:.3rem;
}
#summary .working table + table { margin-top:1.1rem; }
#summary .why { font-size:.84rem; margin:.5rem 0 0; }
details.help { position:relative; display:inline-block; line-height:1; }
details.help summary {
  list-style:none; cursor:help; width:1.05rem; height:1.05rem; border-radius:50%;
  border:1px solid var(--border-strong); color:var(--ink-dim); background:var(--card);
  font-size:.68rem; font-weight:600; font-family:'IBM Plex Mono',monospace;
  display:inline-flex; align-items:center; justify-content:center;
}
details.help summary::-webkit-details-marker { display:none; }
details.help[open] summary { color:var(--accent-ink); border-color:var(--accent); }
details.help > p {
  position:absolute; z-index:20; top:1.4rem; left:0; width:270px; margin:0;
  background:var(--card); border:1px solid var(--border-strong); border-radius:.45rem;
  padding:.6rem .75rem; font-size:.76rem; font-weight:400; line-height:1.45;
  color:var(--ink); text-transform:none; letter-spacing:normal; text-align:left;
  box-shadow:var(--shadow);
}
td details.help > p, caption details.help > p { left:auto; right:0; }
#method summary { list-style:none; display:flex; align-items:baseline; gap:.6rem; cursor:pointer; }
#method summary::-webkit-details-marker { display:none; }
#method summary h2 { margin:0; }
#method .tech { font-size:.8rem; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; }
#method .chev { margin-left:auto; color:var(--ink-dim); transition:transform .15s ease; }
#method details[open] .chev { transform:rotate(90deg); }
#method ul { margin:.8rem 0 .9rem; padding-left:1.1rem; font-size:.85rem; }
#method li { margin-bottom:.35rem; }
#method .sources { font-size:.78rem; color:var(--ink-dim); margin:0; }
#method .sources span { display:block; margin-bottom:.2rem; }
/* roadmap: shares of total effort on one shared axis. Every row is a flex
   triple (label | track | share) with the same label/share widths as the axis
   strip below it, so a given percentage lines up under the same x-position in
   every row's track and in the axis ticks — one shared coordinate system, not
   a per-row axis. */
.roadmap-chart { display:flex; flex-direction:column; }
.roadmap-row { display:flex; align-items:center; gap:.7rem; padding:.4rem 0; cursor:pointer; }
.roadmap-row:hover { background:var(--accent-soft); }
.roadmap-row + .roadmap-row { border-top:1px solid var(--border); }
.roadmap-label { flex:0 0 150px; min-width:0; display:flex; flex-direction:column; gap:.15rem; }
.roadmap-name { font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.roadmap-feature-names { font-size:.7rem; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.roadmap-track {
  position:relative; flex:1; min-width:0; height:.8rem;
  background:var(--border); border-radius:.3rem; overflow:hidden;
}
.roadmap-gridline { position:absolute; top:0; bottom:0; width:1px; background:var(--border-strong); opacity:.55; }
.roadmap-band {
  position:absolute; top:0; height:100%; background:var(--accent); border-radius:.3rem;
  display:flex; overflow:hidden; /* container segments fill it left to right */
}
.roadmap-seg { height:100%; }
.roadmap-share {
  flex:0 0 auto; min-width:4.6rem; text-align:right;
  font-family:'IBM Plex Mono',monospace; font-size:.72rem;
  color:var(--ink-dim); font-variant-numeric:tabular-nums;
}
/* the axis mirrors the row's flex geometry (same label/share widths) so its
   ticks land under the matching percentage in every track above. */
.roadmap-axis {
  display:flex; align-items:flex-end; gap:.7rem; height:1rem; margin-top:.6rem;
  padding-top:.4rem; border-top:1px solid var(--border);
  font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--ink-dim);
}
.roadmap-axis-spacer { flex:0 0 150px; }
.roadmap-axis-ticks { position:relative; flex:1; min-width:0; height:100%; }
.roadmap-axis-ticks span { position:absolute; transform:translateX(-50%); }
.roadmap-axis-unit { flex:0 0 auto; min-width:4.6rem; text-align:right; }
table { width:100%; border-collapse:collapse; font-size:.85rem; }
table th, table td { text-align:left; padding:.45rem .6rem; border-bottom:1px solid var(--border); }
table th { color:var(--ink-dim); font-weight:600; font-size:.76rem; }
table caption {
  caption-side:top; text-align:left; font-size:.82rem; font-weight:600;
  color:var(--ink-dim); padding:0 0 .6rem;
}
tbody tr { transition:background-color .15s ease; }
tbody tr:hover { background:var(--accent-soft); }
td.num, th.num { text-align:right; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
.tag {
  font-size:.68rem; font-weight:600; padding:.12rem .4rem; border-radius:.25rem;
  background:var(--border); color:var(--ink-dim);
}
.tag.proposed { background:var(--warn-soft); color:var(--warn); }
.conf { font-weight:600; font-size:.78rem; }
tr.conf-high .conf { color:var(--ok); }
tr.conf-med .conf { color:var(--warn); }
tr.conf-low .conf { color:var(--bad); }
/* feature breakdown: filter pills, sortable headers, bar-in-cell, task drill-down */
/* container stripe on a row's first cell: inset shadow — no gap to the table
   edge. The color arrives per row as --ct-color; the shadow lives here. */
td.ct-edge { box-shadow:inset 4px 0 0 var(--ct-color); }
.bd-filters { display:flex; flex-wrap:wrap; gap:.9rem; margin:0 0 .8rem; align-items:center; }
/* the tab strip carries the rule under it; the selected tab paints over that
   rule in the accent, so the two read as one edge rather than two lines. */
.bd-tabs {
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:.9rem;
  margin:0 0 .8rem; border-bottom:1px solid var(--border);
}
.tablist { display:flex; gap:1.1rem; margin-bottom:-1px; }
.tablist [role="tab"] {
  border:none; border-bottom:2px solid transparent; border-radius:0;
  background:none; padding:.3rem .1rem; font-size:.84rem; font-weight:600; color:var(--ink-dim);
}
.tablist [role="tab"]:hover { color:var(--accent-ink); }
.tablist [role="tab"][aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
.bd-tabs .bd-filter-group { margin-left:auto; padding-bottom:.35rem; }
.bd-tabs .bd-filter-group button { font-size:.7rem; padding:.2rem .55rem; border-radius:1rem; }
/* on screen a panel is named by its tab; the caption is for paper */
#feature-table caption.panel-name { display:none; }
.bd-count { font-size:.72rem; color:var(--ink-dim); font-variant-numeric:tabular-nums; }
/* effort-by-container donut: slices are stroked circles (pathLength=100 turns
   stroke-dasharray into percent), legend carries the exact numbers. */
#containers .pie-wrap { display:flex; flex-wrap:wrap; align-items:center; gap:1.8rem; }
#containers svg { width:172px; height:172px; flex:0 0 auto; }
#containers .pie-slice.hot { opacity:.75; }
#containers .pie-legend { list-style:none; margin:0; padding:0; display:grid; gap:.35rem; flex:1; min-width:230px; align-content:center; }
#containers .pie-legend li { display:flex; align-items:center; gap:.5rem; font-size:.82rem; }
.swatch { width:.7rem; height:.7rem; border-radius:.2rem; flex:0 0 auto; }
#containers .pie-hours { margin-left:auto; }
#containers .pie-hours, #containers .pie-share {
  font-family:'IBM Plex Mono',monospace; font-size:.76rem; font-variant-numeric:tabular-nums;
}
#containers .pie-share { min-width:2.6rem; text-align:right; color:var(--ink-dim); }
#containers .pie-note { margin:.8rem 0 0; font-size:.76rem; color:var(--ink-dim); }
#containers .pie-legend li.hot { background:var(--accent-soft); border-radius:.3rem; }
.bd-filter-group { display:flex; flex-wrap:wrap; gap:.3rem; align-items:center; }
.bd-filter-group + .bd-filter-group { border-left:1px solid var(--border-strong); padding-left:.9rem; }
.bd-select { gap:.4rem; font-size:.72rem; color:var(--ink-dim); }
.bd-select select {
  font-family:inherit; font-size:.74rem; padding:.2rem .4rem; border-radius:.35rem;
  border:1px solid var(--border-strong); background:var(--card); color:var(--ink); max-width:16rem;
}
.bd-right { display:flex; flex-wrap:wrap; gap:.9rem; align-items:center; margin-left:auto; }
/* the expand group is internal-only; without it the source group must not
   keep the divider that separated the two. */
.view-client .bd-right .bd-filter-group { border-left:none; padding-left:0; }
.bd-filters button { font-size:.7rem; padding:.2rem .55rem; border-radius:1rem; }
.bd-filters button[aria-pressed="true"] {
  border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft);
}
.bd-scroll { overflow-x:auto; }
#feature-table table { min-width:660px; }
#feature-table th button {
  border:none; background:none; padding:0; font:inherit; color:inherit; cursor:pointer;
  white-space:nowrap;
}
#feature-table th button:hover { color:var(--accent-ink); }
#feature-table th[aria-sort="ascending"] button, #feature-table th[aria-sort="descending"] button {
  color:var(--accent-ink);
}
#feature-table td.num { white-space:nowrap; }
/* score cells: centred mono; a 5 reads hot (review it), the tier pill warms with size. */
#feature-table th.score, #feature-table td.score { text-align:center; }
#feature-table td.score { font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
#feature-table td.score.hot { color:var(--bad); font-weight:600; }
#feature-table td.score.total { font-weight:600; white-space:nowrap; }
.tier {
  font-family:'IBM Plex Mono',monospace; font-size:.68rem; font-weight:600;
  padding:.12rem .45rem; border-radius:.25rem; background:var(--border); color:var(--ink-dim);
}
.tier.l { background:var(--warn-soft); color:var(--warn); }
.tier.xl { background:rgba(185,28,28,.1); color:var(--bad); }
#feature-table .edge { color:var(--warn); font-size:.7rem; margin-left:.15rem; cursor:help; }
#feature-table .feat-note { margin-left:1.4rem; }
#feature-table details.guide { margin:.9rem 0 0; border-top:1px solid var(--border); padding-top:.7rem; }
#feature-table details.guide summary { cursor:pointer; font-size:.78rem; font-weight:600; color:var(--ink-dim); }
#feature-table details.guide summary:hover { color:var(--accent-ink); }
.guide-table { min-width:860px; font-size:.78rem; margin-top:.6rem; }
.guide-table td { color:var(--ink-dim); vertical-align:top; }
.guide-table td.dim { color:var(--ink); font-weight:600; white-space:nowrap; }
/* hanging indent: the chevron is its own flex item, so 2-line names wrap
   against their own left edge instead of sliding under the button. */
.feat-cell { display:flex; align-items:baseline; gap:.45rem; }
.feat-cell > span { min-width:0; }
/* the bar lives inside the effort cell: solid fill to expected hours, lighter
   tail to the pessimistic bound, both scaled to the global max so filtered
   views never rescale surviving rows. */
.bd-cell { display:flex; align-items:center; gap:.6rem; }
.bd-track {
  flex:1; min-width:90px; height:.55rem; display:flex;
  background:var(--border); border-radius:.3rem; overflow:hidden;
}
.bd-fill { height:100%; background:var(--accent); opacity:.85; }
.bd-tail { height:100%; background:var(--accent); opacity:.25; }
.bd-num {
  flex:0 0 auto; min-width:3.4rem; text-align:right;
  font-family:'IBM Plex Mono',monospace; font-size:.76rem; font-variant-numeric:tabular-nums;
}
.expand {
  flex:0 0 auto; width:1.05rem; height:1.05rem; padding:0;
  font-size:.6rem; line-height:1; border:none; background:none; color:var(--ink-dim);
  transition:transform .15s ease, color .15s ease;
}
.expand:hover { color:var(--accent-ink); }
.expand[aria-expanded="true"] { transform:rotate(90deg); }
tr.task-row { font-size:.8rem; }
tr.task-row td { background:var(--bg); }
tr.task-row td:first-child { padding-left:2.1rem; }
tr.task-row .bd-cell { justify-content:flex-end; }
.task-assump { font-size:.76rem; color:var(--ink-dim); }
/* a score's reasoning: the rubric sentence the number was anchored to, and
   under it the evidence that sentence rests on. Indented to the name above,
   two columns so the factor labels form their own edge. */
tr.rat-row td { background:var(--bg); }
/* justify-content pins the pair to the left: an `auto` track absorbs the free
   width of a full-span cell, which opened a hand's width of nothing between
   each factor and the sentence it labels. */
.rationale {
  display:grid; grid-template-columns:max-content minmax(0, 68ch); justify-content:start;
  gap:.3rem .9rem; margin:0; padding:.1rem 0 .3rem 2.1rem; font-size:.78rem;
}
.rationale dt {
  font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--ink-dim); white-space:nowrap;
}
.rationale dd { margin:0; }
.rationale .cite { display:block; color:var(--ink-dim); font-size:.74rem; }
#register > div + table, #register > table + table { margin-top:1.4rem; }
.view-client [data\2d internal] { display:none !important; }
/* every exception to the rule above: the control that leaves client view
   cannot be one of the things client view hides. */
.view-client #view-toggle { display:revert !important; }
@media print {
  header { position:static; }
  header button, #viewer-link, details.help, .bd-filters, .bd-tabs, .expand { display:none; }
  main { grid-template-columns:1fr; }
  main > section { box-shadow:none; }
  /* a tab is a screen affordance: on paper both tables print, each under the
     name its tab carried. */
  [role="tabpanel"][hidden] { display:block !important; }
  [role="tabpanel"] + [role="tabpanel"] { margin-top:1.4rem; }
  #feature-table caption.panel-name {
    display:table-caption; text-align:left; font-weight:600; padding-bottom:.4rem;
  }
}
</style>
</head>
<body>
<header>
  <div class="titles">
    <p class="eyebrow">Project estimate</p>
    <h1><!-- slot:TITLE --></h1>
  </div>
  <span id="confidence-badge"></span>
  <button id="theme-toggle" type="button">theme</button>
  <!-- internal:start --><!-- slot:VIEWER --><button id="view-toggle" type="button" data-internal>client view</button><!-- internal:end -->
</header>
<main>
  <div class="col">
    <section id="summary"></section>
    <section id="containers"></section>
    <section id="roadmap"></section>
    <section id="feature-table"></section>
    <template id="scoring-guide"><!-- slot:GUIDE --></template>
    <section id="register"></section>
    <section id="method"></section>
  </div>
</main>
<script type="application/json" id="estimation-data"><!-- slot:DATA --></script>
<script>
/* boot: parse the data island, stamp the title + confidence badge, then
   render the sections and wire the view/theme toggles. */
const DATA = JSON.parse(document.getElementById('estimation-data').textContent);
document.querySelector('header h1').textContent = DATA.inputs.project;
const confLevel = (c) => `conf-${c.toLowerCase()}`;
const badge = document.getElementById('confidence-badge');
badge.textContent = DATA.computed.projectConfidence;
badge.className = `${DATA.computed.projectConfidence.toLowerCase()} ${confLevel(DATA.computed.projectConfidence)}`;

// Summary: the price, stated once — the range this scope is presented at,
// the single number if one is demanded, and how wide the spread behind them
// is. Every number is read from estimation.json's price block; nothing is
// recomputed on the page, and nothing here is a duration: the model prices
// scope, it does not schedule it.
const pctText = (v) => `${Math.round(v * 100)}%`;

// The client-facing figures from proposal-figures.json, when render.mjs was
// handed them — what the client is actually quoted, cost only. Only
// meaningful once this scope is priced.
function summaryRange() {
  const f = DATA.figures;
  if (!f?.cost) return '';
  const single = f.singleNumber ? ` &middot; single number ${fmtMoney(f.singleNumber)}` : '';
  return `<p class="range">proposal ${fmtMoney(f.cost.low)} &ndash; ${fmtMoney(f.cost.high)}${single}</p>`;
}

// R50: "priced" keys on computed.price.p50 !== 0 (some feature scored), not
// on depth or delivery mode. A QUICK-depth estimate scores no feature and
// hits the same all-zero price an agentic estimate does (see
// estimate-template-agentic.html), so it takes the same honest state instead
// of presenting a bare zero as if it were a quote.
function summaryUnpriced() {
  const hours = DATA.inputs.features.reduce((n, f) => n + DATA.computed.features[f.id].hours, 0);
  return `<p class="lead">Not priced</p>
    <p class="figures">${hours.toFixed(2)} h</p>
    <p class="meta">No feature carries a score at ${DATA.inputs.depth} depth — this scope is not
    priced. Hours below are for planning only, not a quote.</p>`;
}

function summaryPriced(p) {
  return `<p class="lead">Presented range</p>
    <p class="figures">${fmtMoney(p.presentLow)}<span class="sep">&ndash;</span>${fmtMoney(p.presentHigh)}</p>
    <p class="meta">single number, if one is required: ${fmtMoney(p.singleNumber)}</p>
    <p class="meta">contingency ${pctText(p.contingencyRate)} · implied accuracy ${pctText(p.impliedAccuracy)}</p>`;
}

// Hours survive as delivery planning only — they size the backlog and they
// never convert into the price above them. The project total is internal: a
// client shown hours beside the price divides one by the other (spec §3/§12,
// R61). A --client-only render has no view toggle and never draws it; the
// internal page marks it so the client-view preview hides it too.
function summaryHours(feats) {
  if (!document.getElementById('view-toggle')) return '';
  const hours = feats.reduce((n, f) => n + DATA.computed.features[f.id].hours, 0);
  return `<span ${INTERNAL_ATTR}>${Math.round(hours).toLocaleString()} h to plan · </span>`;
}

function summarySize() {
  const feats = DATA.inputs.features;
  const tasks = feats.reduce((n, f) => n + f.tasks.length, 0);
  const milestones = new Set(feats.map((f) => f.milestone).filter(Boolean)).size;
  const parts = [`${feats.length} features`, `${tasks} tasks`];
  if (milestones) parts.push(`${milestones} milestones`);
  return summaryHours(feats) + parts.join(' · ');
}

function summaryMethod() {
  const feats = DATA.inputs.features;
  const stated = feats.filter((f) => f.provenance === 'stated').length;
  return `${DATA.inputs.technique}, ${DATA.inputs.depth} depth · scope ${stated}/${feats.length} stated`;
}

function summaryRisks() {
  return `${DATA.inputs.risks.length} risks · ${DATA.inputs.assumptions.length} assumptions`;
}

// Free text the writer chose to leave about the approach — delivery mode,
// technique, anything else worth a sentence (references/writing.md §1). It
// explains a judgment call, not a choice between priced options.
function summaryApproach() {
  const why = DATA.inputs.recommendedReason;
  return why ? `<p class="why" ${INTERNAL_ATTR}>Approach: ${esc(why)}.</p>` : '';
}

function renderSummary() {
  const el = document.getElementById('summary');
  if (!el) return;
  const p = DATA.computed.price;
  const priced = p.p50 !== 0;
  el.innerHTML = secHead('Summary',
    'What this scope is priced at, stated once: the range presented to the client, the '
    + 'single number to give if one is demanded, and the contingency and spread behind '
    + 'both. Shares of effort are shown below; no duration is produced anywhere.')
    + (priced ? summaryPriced(p) : summaryUnpriced())
    + (priced ? summaryRange() : '')
    + `<p class="meta">${summarySize()}</p>
    <p class="meta">${summaryMethod()}</p>
    <p class="meta">${summaryRisks()}</p>
    ${summaryApproach()}
    <div class="working" id="price-working" ${INTERNAL_ATTR}></div>`;
}

const fmtMoney = (v) => `$${Math.round(v).toLocaleString()}`;

const help = (text) => `<details class="help"><summary aria-label="explain this section">?</summary><p>${text}</p></details>`;
const secHead = (title, text, actions = '') => `<div class="sec-head"><h2>${title}</h2>${help(text)}${actions}</div>`;







// One interactive section owns the feature story: bar-in-cell effort (was the
// effort chart), the sortable feature table, and the per-task drill-down (was
// the flat task register). Committed numbers only.
const CONF_RANK = { HIGH: 0, MED: 1, LOW: 2 };
// Two levels max (schema-enforced), so a component's container is one parent
// hop at most; a top-level id is its own container.
const COMP_PARENT = Object.fromEntries((DATA.inputs.components ?? []).map((c) => [c.id, c.parent]));
const containerOf = (id) => COMP_PARENT[id] ?? id;
// One color per top-level container, shared by the donut and the roadmap
// segments so a hue means the same container everywhere on the page.
const CT_COLORS = ['#5a9fd4', '#d97757', '#3ba99f', '#d9b95e', '#9d86c9',
  '#5dbb7a', '#c47a94', '#7c8f9e', '#c98a4b', '#a8a29e'];
const CT_TOPS = (DATA.inputs.components ?? []).filter((c) => !c.parent).map((c) => c.id);
const ctColor = (id) => CT_COLORS[CT_TOPS.indexOf(id) % CT_COLORS.length];
const CT_NAMES = Object.fromEntries((DATA.inputs.components ?? []).map((c) => [c.id, c.name]));

// Attributes for a row's first cell: a full-height container-colored stripe,
// named on hover. The shadow geometry lives in the td.ct-edge class; only the
// color travels inline, as a custom property — same pattern as the bar widths.
// No roster → no stripe, not a grey placeholder.
function ctEdge(component) {
  if (!DATA.inputs.components) return '';
  const id = containerOf(component);
  return ` class="ct-edge" style="--ct-color:${ctColor(id)}" title="${esc(CT_NAMES[id] ?? id)}"`;
}
// Scores are the interview's judgments (features[].scores), never derived
// from hours; Σ and tier were copied into computed.features by rollup.mjs.
// A page with no scored feature (QUICK depth) shows the four estimate columns.
const SCORED = DATA.inputs.features.length > 0 && DATA.inputs.features.every((f) => f.scores);
// The tier is the price band a score bought, so it is pricing working: a
// --client-only render has it stripped out of computed.features entirely
// (redact.mjs), and the column goes with it rather than rendering blanks.
const TIERED = SCORED && DATA.inputs.features.every((f) => DATA.computed.features[f.id].tier);
const SCORE_KEYS = ['tech', 'size', 'deps', 'unc', 'risk'];
const SCORE_LABELS = { tech: 'Tech', size: 'Size', deps: 'Deps', unc: 'Unc', risk: 'Risk' };
const EDGE_TOTALS = [11, 17, 22];

// Two tabs, two jobs: effort is arithmetic over tasks, scoring is the
// interview's judgment of the feature. One grid holding both ran eleven
// columns wide and scrolled sideways on every screen. Each tab keeps its own
// sort — a reader ordering by Σ has not asked to lose their effort order —
// while the filters, the grouping and the expanded set are shared, because
// they are questions about features rather than about either view.
const TABS = [['estimate', 'Estimate'], ['scoring', 'Scoring']];
const TAB_LABELS = Object.fromEntries(TABS);
const SORT_DEFAULTS = { estimate: { key: 'hours', dir: -1 }, scoring: { key: 'total', dir: -1 } };
const bdState = {
  tab: 'estimate',
  sort: { estimate: { ...SORT_DEFAULTS.estimate }, scoring: { ...SORT_DEFAULTS.scoring } },
  milestone: '', component: '', prov: '', group: false, expanded: new Set(), guideOpen: true,
};
const DESC_FIRST = ['hours', 'total'];

const BASE_COLS = {
  name: { key: 'name', label: 'Feature', val: (f) => f.name, hint: 'sort by name' },
  hours: { key: 'hours', label: 'Effort (h)', val: (f) => f.hours, hint: 'sort by expected hours' },
  conf: { key: 'conf', label: 'Confidence', val: (f) => CONF_RANK[f.conf], hint: 'sort by confidence' },
  prov: { key: 'provenance', label: 'Source', val: (f) => f.provenance, hint: 'sort by source' },
};

function bdCols(tab) {
  if (!SCORED || tab === 'estimate') {
    return [BASE_COLS.name, BASE_COLS.hours, BASE_COLS.conf, BASE_COLS.prov];
  }
  const scoreCols = SCORE_KEYS.map((k) => ({
    key: k, label: SCORE_LABELS[k], cls: 'score', val: (f) => f.scores[k].n, hint: `sort by ${SCORE_LABELS[k]} score`,
  }));
  const cols = [BASE_COLS.name, ...scoreCols,
    { key: 'total', label: 'Score', cls: 'score', val: (f) => f.scoreTotal,
      hint: 'weighted score: uncertainty 30%, tech, deps and risk 20% each, size 10%, on a 5-25 scale' }];
  if (!TIERED) return cols;
  return [...cols, { key: 'tier', label: 'Tier', cls: 'score', internal: true,
    val: (f) => f.scoreTotal, hint: 'S < 11.5 / M < 17.5 / L < 22.5 / XL from 22.5' }];
}

const bdTabs = () => (SCORED ? TABS.map(([id]) => id) : ['estimate']);

function breakdownData() {
  return DATA.inputs.features.map((f) => {
    const c = DATA.computed.features[f.id];
    const conf = f.tasks.reduce(
      (w, t) => (CONF_RANK[t.confidence] > CONF_RANK[w] ? t.confidence : w), 'HIGH');
    return { id: f.id, name: f.name, milestone: f.milestone, component: f.component, provenance: f.provenance,
      tasks: f.tasks, conf, hours: c.hours, low: c.low, high: c.high, spread: c.high - c.low,
      scores: f.scores, scoreNote: f.scoreNote, scoreProvenance: f.scoreProvenance,
      scoreTotal: c.scoreTotal, tier: c.tier };
  });
}

// group is a primary key layered over the column sort: rows cluster by
// container (roster order — the palette's order) so the stripes read as the
// same blocks of color as the roadmap band that set the filter.
function bdSorted(list, tab) {
  const { key, dir } = bdState.sort[tab];
  const col = bdCols(tab).find((c) => c.key === key);
  const ctRank = (f) => CT_TOPS.indexOf(containerOf(f.component));
  return list.slice().sort((a, b) => {
    const byGroup = bdState.group ? ctRank(a) - ctRank(b) : 0;
    if (byGroup) return byGroup;
    const [x, y] = [col.val(a), col.val(b)];
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
}

function bdVisible(list) {
  return list.filter((f) => (!bdState.milestone || f.milestone === bdState.milestone)
    && (!bdState.component || containerOf(f.component) === bdState.component)
    && (!bdState.prov || f.provenance === bdState.prov));
}

// Which features someone is looking at is a question about the estimate, not
// about their session, so the answer travels: every breakdown choice is
// written into the fragment and a pasted link reopens that exact table. A
// fragment rather than a query because the page is as often opened off a disk
// copy as served, and a fragment survives both without reaching a server.
// Defaults are never written, so an untouched page has no hash to copy.
const FEAT_IDS = DATA.inputs.features.map((f) => f.id);

function bdOpenParam() {
  if (!bdState.expanded.size) return '';
  return bdState.expanded.size === FEAT_IDS.length ? 'all'
    : FEAT_IDS.filter((id) => bdState.expanded.has(id)).join(',');
}

function bdSortParams(p) {
  bdTabs().forEach((tab) => {
    const { key, dir } = bdState.sort[tab];
    const d = SORT_DEFAULTS[tab];
    if (key !== d.key || dir !== d.dir) p.append('sort', `${tab}:${key}:${dir}`);
  });
}

function bdEncode() {
  const p = new URLSearchParams();
  const put = (k, v) => { if (v) p.append(k, v); };
  put('tab', bdState.tab === 'estimate' ? '' : bdState.tab);
  put('ms', bdState.milestone);
  put('ct', bdState.component);
  put('src', bdState.prov);
  put('group', bdState.group ? '1' : '');
  put('open', bdOpenParam());
  put('guide', bdState.guideOpen ? '' : '0');
  bdSortParams(p);
  return p.toString();
}

// A colleague's copy can hold different features. A filter naming a milestone
// that copy has never heard of would empty the table with no hint why, so
// anything the data does not know is dropped rather than applied.
const bdPick = (value, allowed) => (allowed.includes(value) ? value : '');

function bdDecodeSort(p) {
  p.getAll('sort').forEach((s) => {
    const [tab, key, dir] = s.split(':');
    if (!SORT_DEFAULTS[tab] || !bdCols(tab).some((c) => c.key === key)) return;
    bdState.sort[tab] = { key, dir: dir === '1' ? 1 : -1 };
  });
}

function bdDecodeOpen(value) {
  if (value === 'all') return new Set(FEAT_IDS);
  return new Set((value ?? '').split(',').filter((id) => FEAT_IDS.includes(id)));
}

function bdDecode(hash) {
  const p = new URLSearchParams(hash);
  const all = breakdownData();
  bdState.tab = bdPick(p.get('tab'), bdTabs()) || 'estimate';
  bdState.milestone = bdPick(p.get('ms'), all.map((f) => f.milestone));
  bdState.component = bdPick(p.get('ct'), all.map((f) => containerOf(f.component)));
  bdState.prov = bdPick(p.get('src'), all.map((f) => f.provenance));
  bdState.group = p.get('group') === '1';
  bdState.guideOpen = p.get('guide') !== '0';
  bdState.expanded = bdDecodeOpen(p.get('open'));
  bdDecodeSort(p);
}

// replaceState, not pushState: someone clicking through four sorts has not
// asked for four back-button stops. A few browsers refuse a history write on
// a file:// page, so the fragment is assigned directly when that throws — the
// hashchange that assignment fires arrives at a state already matching this
// one, and the guard below stops it there.
function bdSyncUrl() {
  const q = bdEncode();
  if (q === location.hash.slice(1)) return;
  try { history.replaceState(null, '', location.pathname + location.search + (q ? `#${q}` : '')); }
  catch { location.hash = q; }
}

// The chevron opens tasks on the estimate tab and the scoring reasoning on
// the other, so the control that drives every chevron is internal-only for
// the first and open to the client for the second — tasks and their
// assumptions are ours, the rubric sentences are theirs to read.
function bdExpandControls() {
  const internal = bdState.tab === 'estimate' ? ` ${INTERNAL_ATTR}` : '';
  const what = bdState.tab === 'estimate' ? 'tasks' : 'score reasoning';
  return `<span class="bd-filter-group"${internal} role="group" aria-label="${what}">
    <button type="button" data-expand="all">expand all</button>
    <button type="button" data-expand="none">collapse all</button></span>`;
}

// A tab strip, not a pill filter: each tab owns a panel, arrow keys move
// between them, and the selected one is the page's single source of truth for
// which columns are on screen. One view needs no strip, so QUICK depth gets
// the expand controls alone.
function bdTabStrip() {
  const strip = SCORED ? `<div class="tablist" role="tablist" aria-label="feature views">${
    TABS.map(([id, label]) => {
      const on = bdState.tab === id;
      return `<button type="button" role="tab" id="tab-${id}" data-tab="${id}"
        aria-selected="${on}" aria-controls="panel-${id}" tabindex="${on ? 0 : -1}">${label}</button>`;
    }).join('')}</div>` : '';
  return `<div class="bd-tabs">${strip}${bdExpandControls()}</div>`;
}

// The handler lives in a separate internal-only script (the embedded workbook
// carries pricing bands), so the button no-ops gracefully in a client render —
// where the client-view CSS hides it anyway.
function bdDownloadBtn() {
  return `<span class="bd-filter-group" role="group" aria-label="export">
    <button type="button" data-download ${INTERNAL_ATTR}
      title="download every feature as a scoring spreadsheet">download xlsx</button></span>`;
}

function selectBox({ name, key, current, pairs }) {
  return `<label class="bd-filter-group bd-select">${name}<select data-select="${key}" aria-label="${name}">
    ${pairs.map(([v, text]) =>
    `<option value="${esc(v)}"${v === current ? ' selected' : ''}>${esc(text)}</option>`).join('')}</select></label>`;
}

// Three filters, one widget, one row: source used to be a pill group beside
// two selects, which read as three unrelated controls doing one job. They ask
// the same question of both tabs, so they sit above the strip, not inside a
// panel.
function bdFilters(all, shown) {
  const boxes = [];
  if (all.every((f) => f.milestone)) {
    const labels = [...new Set(all.map((f) => f.milestone))];
    boxes.push(selectBox({ name: 'milestone', key: 'milestone', current: bdState.milestone,
      pairs: [['', 'all milestones'], ...labels.map((l) => [l, l])] }));
  }
  if (DATA.inputs.components) {
    const names = Object.fromEntries(DATA.inputs.components.map((c) => [c.id, c.name]));
    const tops = [...new Set(all.map((f) => containerOf(f.component)))];
    boxes.push(selectBox({ name: 'container', key: 'component', current: bdState.component,
      pairs: [['', 'all containers'], ...tops.map((id) => [id, names[id] ?? id])] }));
  }
  boxes.push(selectBox({ name: 'source', key: 'prov', current: bdState.prov,
    pairs: [['', 'all sources'], ['stated', 'stated'], ['proposed', 'proposed']] }));
  return `<div class="bd-filters">${boxes.join('')}${bdCount(all.length, shown)}</div>`;
}

// Filters moved out of the table's own header row, so the count is how a
// reader sees that rows are missing rather than absent. It states the plain
// total until something is actually filtered.
function bdCount(total, shown) {
  const filtered = shown < total;
  const text = filtered ? `${shown} of ${total} features` : `${total} features`;
  const clear = filtered ? '<button type="button" data-clear>clear</button>' : '';
  return `<span class="bd-right"><span class="bd-count">${text}</span>${clear}</span>`;
}

function bdHead(tab) {
  const { key, dir } = bdState.sort[tab];
  return `<thead><tr>${bdCols(tab).map((c) => {
    // grouping overrides the column order, so no header may claim its sort
    const active = !bdState.group && key === c.key;
    const aria = active ? (dir === 1 ? 'ascending' : 'descending') : 'none';
    const arrow = active ? (dir === 1 ? ' &#9650;' : ' &#9660;') : '';
    return `<th aria-sort="${aria}"${c.cls ? ` class="${c.cls}"` : ''}${c.internal ? ` ${INTERNAL_ATTR}` : ''}>
      <button type="button" data-sort="${c.key}" data-panel="${tab}" title="${c.hint}">${c.label}${arrow}</button></th>`;
  }).join('')}</tr></thead>`;
}

function bdBar(f, max) {
  const fill = Math.round((f.hours / max) * 100);
  const tail = Math.round(((f.high - f.hours) / max) * 100);
  return `<span class="bd-track" title="${f.tasks.length} tasks &middot; ${f.low}&ndash;${f.high}h span">
    <span class="bd-fill" style="width:${fill}%"></span><span class="bd-tail" style="width:${tail}%"></span></span>`;
}

// A feature row's score cells: the five 1–5s, their sum, and the tier. A 5 is
// flagged hot — the score a human should eyeball before the sheet goes out.
function scoreCells(f) {
  const cells = SCORE_KEYS.map((k) => {
    const s = f.scores[k];
    // A client render carries no cites (redact.mjs blanks them), so the title
    // is the anchor alone rather than a sentence with a dangling dash.
    const title = s.cite ? `${esc(s.anchor)} — ${esc(s.cite)}` : esc(s.anchor);
    return `<td class="score${s.n === 5 ? ' hot' : ''}" title="${title}">${s.n}</td>`;
  });
  const edge = EDGE_TOTALS.includes(f.scoreTotal)
    ? ' <span class="edge" title="one point from the next tier">&#9873;</span>' : '';
  const tier = TIERED
    ? `<td class="score" ${INTERNAL_ATTR}><span class="tier ${f.tier.toLowerCase()}">${f.tier}</span></td>` : '';
  return `${cells.join('')}<td class="score total">${f.scoreTotal}${edge}</td>${tier}`;
}

function hoursCell(f, max) {
  return `<td><span class="bd-cell">${bdBar(f, max)}<span class="bd-num">${f.hours}</span></span></td>`;
}

function estimateCells(f) {
  return `<td><span class="conf">${f.conf}</span></td>
    <td><span class="tag ${f.provenance}">${f.provenance}</span></td>`;
}

// The name cell is the spine both tabs share: container stripe, the chevron
// that opens this feature's detail, the name. What the chevron opens, and
// whether a client may open it, is the caller's call.
function nameCell(f, internal, note) {
  const open = bdState.expanded.has(f.id);
  const label = internal ? 'show tasks' : 'show score reasoning';
  return `<td${ctEdge(f.component)}><span class="feat-cell"><button type="button" class="expand"${internal ? ` ${INTERNAL_ATTR}` : ''}
      aria-expanded="${open}" aria-label="${label}">&#9656;</button>
      <span>${f.name}</span></span>${note}</td>`;
}

function featRow(f, max) {
  return `<tr class="feat-row ${confLevel(f.conf)}" data-id="${esc(f.id)}">
    ${nameCell(f, true, '')}${hoursCell(f, max)}${estimateCells(f)}</tr>`;
}

// The note is the plain sentence the interview wrote for the client about why
// this tier — it belongs beside the scores it summarises, not under an
// effort bar it never described.
function scoreRow(f) {
  const note = f.scoreNote ? `<div class="task-assump feat-note">${esc(f.scoreNote)}</div>` : '';
  return `<tr class="feat-row" data-id="${esc(f.id)}">${nameCell(f, false, note)}${scoreCells(f)}</tr>`;
}

// Task rows sit under the feature's name and fill the estimate tab's four
// columns exactly — tasks carry three-point hours, a confidence and a
// category, never scores, which is why they have no home on the other tab.
// Task rows are internal-only in every render (the whole row carries
// INTERNAL_ATTR), but the same JS builds both tabs' markup regardless of
// which one is visible, so a --client-only page still runs this over tasks
// whose confidence/assumptions redact.mjs has stripped (R49) — null-guarded,
// not assumed, same as every other stripped field on this page.
function taskRows(f) {
  return f.tasks.map((t) => `<tr class="task-row ${t.confidence ? confLevel(t.confidence) : ''}" ${INTERNAL_ATTR}>
    <td${ctEdge(f.component)}>${t.name}<div class="task-assump">${(t.assumptions ?? []).join('; ') || 'none'}</div></td>
    <td><span class="bd-cell"><span class="bd-num">${t.o}/${t.m}/${t.p}</span></span></td>
    <td><span class="conf">${t.confidence ?? ''}</span></td>
    <td><span class="tag">${t.category}</span></td></tr>`).join('');
}

// Every score is required to carry the rubric sentence it was anchored to and
// the evidence that sentence rests on. Both lived in a title attribute, which
// no touch screen, printer or find-in-page has ever shown anyone. A client
// render keeps the anchors and loses the cites (redact.mjs blanks them), so
// the block degrades to five sentences rather than five empty quotes.
function rationaleRows(f) {
  const items = SCORE_KEYS.map((k) => {
    const s = f.scores[k];
    // A cite is internal shorthand twice over: redact.mjs blanks it for a
    // --client-only render, and the view toggle — which previews that render
    // without re-rendering — has to hide it too, or an internal ticket phrase
    // stays on screen through a client call.
    const cite = s.cite ? `<span class="cite" ${INTERNAL_ATTR}>${esc(s.cite)}</span>` : '';
    return `<dt>${SCORE_LABELS[k]} ${s.n}</dt><dd>${esc(s.anchor)}${cite}</dd>`;
  }).join('');
  return `<tr class="rat-row"><td${ctEdge(f.component)} colspan="${bdCols('scoring').length}">
    <dl class="rationale">${items}</dl></td></tr>`;
}

function bdRows(f, tab, max) {
  const open = bdState.expanded.has(f.id);
  if (tab === 'scoring') return scoreRow(f) + (open ? rationaleRows(f) : '');
  return featRow(f, max) + (open ? taskRows(f) : '');
}

// The rubric comes from references/scoring-guide.md through the GUIDE slot,
// so the page and the interviewer explain a score in the same sentences. The
// fold opens on first view and then keeps whatever the reader chose: every
// sort and filter rebuilds this markup, so its state lives in bdState.
function bdGuide() {
  const guide = document.getElementById('scoring-guide');
  if (!SCORED || !guide) return '';
  const open = bdState.guideOpen ? ' open' : '';
  return `<details class="guide" data-guide${open}><summary>Scoring guide &mdash; what each 1&ndash;5 means</summary>
    <div class="bd-scroll">${guide.innerHTML}</div></details>`;
}

// Both panels render; the idle one is `hidden`. That keeps every tab's
// aria-controls pointing at a node that exists, makes the switch instant, and
// lets print simply unhide the pair — a tab is a screen affordance, and paper
// has room for both tables.
function bdPanel(tab, all, max) {
  const rows = bdVisible(bdSorted(all, tab)).map((f) => bdRows(f, tab, max)).join('');
  const tabbed = SCORED ? ` role="tabpanel" aria-labelledby="tab-${tab}" tabindex="0"` : '';
  const caption = SCORED ? `<caption class="panel-name">${TAB_LABELS[tab]}</caption>` : '';
  const guide = tab === 'scoring' ? bdGuide() : '';
  return `<div id="panel-${tab}"${tabbed}${bdState.tab === tab ? '' : ' hidden'}>
    <div class="bd-scroll"><table>${caption}${bdHead(tab)}<tbody>${rows}</tbody></table></div>${guide}</div>`;
}

const BD_HELP = 'Estimate is the arithmetic: hours is the PERT expected value '
  + 'E = (O + 4M + P) / 6 summed over the feature’s tasks, and the bar shows E with a '
  + 'lighter tail to the pessimistic bound, so a long tail means an uncertain feature. '
  + 'Scoring is the judgment behind it: the interview’s five factors, their sum and the '
  + 'tier they fall in. Filters apply to both tabs. Sort any column, and expand a row for '
  + 'the tasks behind an estimate or the rubric sentence and evidence behind a score.';

function renderBreakdown() {
  const el = document.getElementById('feature-table');
  if (!el) return;
  const all = breakdownData();
  const max = Math.max(...all.map((f) => f.high));
  const panels = bdTabs().map((tab) => bdPanel(tab, all, max)).join('');
  el.innerHTML = secHead('Feature breakdown', BD_HELP, bdDownloadBtn())
    + bdTabStrip() + bdFilters(all, bdVisible(all).length) + panels;
  bdSyncUrl();
}

function bdSort(key, tab) {
  // an explicit sort takes control back from the roadmap grouping — and starts
  // fresh at the column's default direction, since no sort was showing.
  const s = bdState.sort[tab];
  const fresh = bdState.group || s.key !== key;
  bdState.group = false;
  if (fresh) { s.key = key; s.dir = DESC_FIRST.includes(key) ? -1 : 1; }
  else s.dir = -s.dir;
  renderBreakdown();
}

// Re-rendering replaces the strip, so the newly selected tab has to be handed
// the focus back — otherwise a keyboard reader lands at the top of the page.
function bdSelectTab(tab) {
  if (bdState.tab === tab) return;
  bdState.tab = tab;
  renderBreakdown();
  document.getElementById(`tab-${tab}`)?.focus();
}

function bdClearFilters() {
  bdState.milestone = '';
  bdState.component = '';
  bdState.prov = '';
  bdState.group = false;
  renderBreakdown();
}

function bdToggle(id) {
  if (bdState.expanded.has(id)) bdState.expanded.delete(id);
  else bdState.expanded.add(id);
  renderBreakdown();
}

function bdExpandAll(mode) {
  bdState.expanded = mode === 'all'
    ? new Set(DATA.inputs.features.map((f) => f.id)) : new Set();
  renderBreakdown();
}

function onBreakdownClick(e) {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.sort) bdSort(btn.dataset.sort, btn.dataset.panel);
  else if (btn.dataset.tab) bdSelectTab(btn.dataset.tab);
  else if (btn.dataset.expand) bdExpandAll(btn.dataset.expand);
  else if (btn.dataset.clear !== undefined) bdClearFilters();
  else if (btn.dataset.download !== undefined) window.__downloadXlsx?.();
  else if (btn.classList.contains('expand')) bdToggle(btn.closest('tr').dataset.id);
}

// Arrow keys move within the strip, as a tablist is expected to: the strip is
// one tab stop and Left/Right choose inside it.
function onBreakdownKeydown(e) {
  const tab = e.target.closest?.('[role="tab"]');
  const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!tab || !step) return;
  e.preventDefault();
  const ids = bdTabs();
  bdSelectTab(ids[(ids.indexOf(tab.dataset.tab) + step + ids.length) % ids.length]);
}

function onBreakdownChange(e) {
  const sel = e.target.closest('select[data-select]');
  if (!sel) return;
  bdState[sel.dataset.select] = sel.value;
  renderBreakdown();
}

// Slice ↔ legend row, both directions: a 2% donut slice is unhoverable-thin
// for reading, so pointing at it lights the row that names it — and pointing
// at a legend row lights its slice, so a name finds its arc just as easily.
function onPieHover(e) {
  const id = e.target.closest?.('[data-ct]')?.dataset.ct;
  const on = e.type === 'mouseover';
  for (const el of document.querySelectorAll('#containers [data-ct]')) {
    el.classList.toggle('hot', on && el.dataset.ct === id);
  }
}

// A roadmap row is a shortcut into the breakdown: stale container/source
// filters would silently hide the milestone's rows, so the click clears them
// before filtering. Clicking the active row again clears the milestone too.
function onRoadmapClick(e) {
  const row = e.target.closest('.roadmap-row');
  if (!row) return;
  bdState.milestone = bdState.milestone === row.dataset.milestone ? '' : row.dataset.milestone;
  bdState.component = '';
  bdState.prov = '';
  // group the surviving rows by container so their stripes cluster like the
  // clicked band's segments — same colors, same blocks, one story.
  bdState.group = bdState.milestone !== '';
  renderBreakdown();
  document.getElementById('feature-table')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// The roadmap's scale is a share of the whole scope, not elapsed time: the
// milestone shares computed.roadmap carries sum to 1, so the axis is a fixed
// 0–100% and every row's gridlines and the axis strip below them read off the
// same quarters — one coordinate system, not a per-row axis.
const SHARE_TICKS = [0, 25, 50, 75, 100];

const edgeStyle = (pct, pin) => (pct <= 0 ? `left:0${pin}` : pct >= 100 ? `right:0${pin}` : `left:${pct}%`);

// Milestone names and feature lists are the only free text the roadmap draws, and
// they now land in an attribute as well as in the body — so both are escaped
// rather than the quote being left to break out of the title.
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// Inside a band, each top-level container the milestone touches gets a slice
// of the bar sized by its share of the milestone's hours — several colors is a
// vertical slice, one color is the horizontal-slice smell. Same palette as the
// donut. No roster → empty string, and the band keeps its solid accent fill.
function bandSegments(band) {
  if (!DATA.computed.components) return '';
  const compOf = Object.fromEntries(DATA.inputs.features.map((f) => [f.id, f.component]));
  const names = Object.fromEntries(DATA.inputs.components.map((c) => [c.id, c.name]));
  const hours = {};
  for (const id of band.features) {
    const c = containerOf(compOf[id]);
    hours[c] = (hours[c] ?? 0) + DATA.computed.features[id].hours;
  }
  const sum = Object.values(hours).reduce((a, b) => a + b, 0);
  return Object.entries(hours).map(([c, h]) =>
    `<span class="roadmap-seg" style="width:${((h / sum) * 100).toFixed(2)}%;background:${ctColor(c)}"
      title="${esc(`${names[c] ?? c} · ${h.toFixed(2)}h (${Math.round((h / sum) * 100)}%)`)}"></span>`).join('');
}

const ROADMAP_GRIDLINES = SHARE_TICKS
  .map((t) => `<span class="roadmap-gridline" style="${edgeStyle(t, '')}"></span>`).join('');

// Every bar starts at the left edge: the rows are shares of one whole, read
// against each other, and sliding them along an axis would draw a sequence
// in time that nothing computed.
function roadmapRow(band, names) {
  // 150px of label column against "M1 - Foundation: the governed write path": every
  // row clips, and a clipped label names nothing. Widening the column would cost the
  // bars the span they need, so each label carries its own full text as a hover
  // title instead.
  const feats = band.features.map((id) => names[id]);
  return `<div class="roadmap-row" data-milestone="${esc(band.milestone)}">
    <div class="roadmap-label"><span class="roadmap-name" title="${esc(band.milestone)}">${esc(band.milestone)}</span>
      <span class="roadmap-feature-names" title="${esc(feats.join(' · '))}">${feats.map(esc).join(' &middot; ')}</span></div>
    <div class="roadmap-track">${ROADMAP_GRIDLINES}<span class="roadmap-band" style="left:0;width:${(band.share * 100).toFixed(2)}%">${bandSegments(band)}</span></div>
    <span class="roadmap-share">${pctText(band.share)}</span></div>`;
}

// The two edge ticks are pinned to the track's own edges instead of centered,
// so they never overhang the section.
function roadmapAxis() {
  const tick = (t) => `<span style="${edgeStyle(t, ';transform:none')}">${t}</span>`;
  return `<div class="roadmap-axis"><span class="roadmap-axis-spacer"></span>
    <div class="roadmap-axis-ticks">${SHARE_TICKS.map(tick).join('')}</div>
    <span class="roadmap-axis-unit">% of effort</span></div>`;
}

// Committed numbers only: the roadmap draws computed.roadmap as computed —
// milestones in delivery order, each sized by its share of total effort.
function renderRoadmap() {
  const el = document.getElementById('roadmap');
  if (!el) return;
  const roadmap = DATA.computed.roadmap;
  if (!roadmap) { el.remove(); return; }
  const names = Object.fromEntries(DATA.inputs.features.map((f) => [f.id, f.name]));
  el.innerHTML = secHead('Roadmap',
    'Milestones in delivery order, each bar its share of total effort. Shares are not '
    + 'durations and they are not dates — this estimate produces no timeline. Band '
    + 'colors are the containers the milestone touches (same palette as the chart above). '
    + 'Click a row to filter the breakdown below to that milestone, grouped by container.')
    + `<div class="roadmap-chart">${roadmap.map((b) => roadmapRow(b, names)).join('')}`
    + `${roadmapAxis()}</div>`;
}

// Committed numbers only, like every section: expected hours summed per
// top-level container (computed.components), drawn as a donut. A container
// the roster excused with notEstimated never becomes a zero-width slice —
// it keeps the honest words in the note under the chart instead.
function pieSlice([id, h], ctx) {
  const share = (h / ctx.total) * 100;
  const off = 25 - ctx.acc;
  ctx.acc += share;
  return `<circle class="pie-slice" data-ct="${esc(id)}" cx="21" cy="21" r="15.915" fill="none" pathLength="100"
    stroke="${ctColor(id)}" stroke-width="7" stroke-dasharray="${share.toFixed(2)} ${(100 - share).toFixed(2)}"
    stroke-dashoffset="${off.toFixed(2)}"><title>${esc(`${ctx.names[id] ?? id} · ${h}h (${Math.round(share)}%)`)}</title></circle>`;
}

function pieLegendRow([id, h], ctx) {
  return `<li data-ct="${esc(id)}"><span class="swatch" style="background:${ctColor(id)}"></span>
    <span>${esc(ctx.names[id] ?? id)}</span>
    <span class="pie-hours">${h}h</span> <span class="pie-share">${Math.round((h / ctx.total) * 100)}%</span></li>`;
}

function pieNote() {
  const excused = (DATA.inputs.components ?? []).filter((c) => c.notEstimated);
  if (!excused.length) return '';
  return `<p class="pie-note">Not estimated: ${excused.map((c) =>
    `${esc(c.name)} (${esc(c.notEstimated)})`).join('; ')}. In the architecture, no sized work yet.</p>`;
}

function renderContainers() {
  const el = document.getElementById('containers');
  if (!el) return;
  const comp = DATA.computed.components;
  if (!comp) { el.remove(); return; }
  const names = Object.fromEntries(DATA.inputs.components.map((c) => [c.id, c.name]));
  const entries = Object.entries(comp).filter(([, h]) => h > 0).sort(([, a], [, b]) => b - a);
  const ctx = { names, total: entries.reduce((s, [, h]) => s + h, 0), acc: 0 };
  el.innerHTML = secHead('Effort by container',
    'Share of expected hours per top-level container, from the same task numbers as the '
    + 'breakdown. The colors match the roadmap bands. A container nobody sized is named '
    + 'under the chart, never drawn as a zero slice.')
    + `<div class="pie-wrap"><svg viewBox="0 0 42 42" role="img" aria-label="effort share by container">
      ${entries.map((e) => pieSlice(e, ctx)).join('')}</svg>
      <ul class="pie-legend">${entries.map((e) => pieLegendRow(e, { ...ctx, acc: 0 })).join('')}</ul></div>${pieNote()}`;
}

// Assembled at runtime (never one static literal, so the client-only render's
// page text can't carry it): the task
// drill-down is per-task WBS detail, not meant for the client view, so its
// rows and expand buttons carry the internal-hide attribute — but that
// attribute name must never appear as page text in a --client-only export.
const INTERNAL_ATTR = ['data', 'internal'].join('-');

function renderRegister() {
  const el = document.getElementById('register');
  if (!el) return;
  const riskRows = DATA.inputs.risks.map((r) => `<tr><td>${r.name}</td><td class="num">${Math.round(r.probability * 100)}%</td><td class="num">${r.impactHours}h</td></tr>`).join('');
  el.innerHTML = `<table><caption>Risk register ${help(
    'The named risks behind the risk scores. Risk is priced through those scores and the '
    + 'contingency they size, never by adding these hours to a total — the register is what '
    + 'the judgment rests on, and what to watch during delivery.')}</caption>
    <thead><tr><th>Risk</th><th class="num">Probability</th><th class="num">Impact</th></tr></thead>
    <tbody>${riskRows}</tbody></table>`;
}

// The words are static; every number shown is read from inputs, never derived.
// Collapsed by default: the title row names the technique, the fold carries
// the full pipeline and sources for whoever wants them.
function renderMethod() {
  const el = document.getElementById('method');
  if (!el) return;
  el.innerHTML = `<details class="method-fold" open><summary><h2>Method</h2>
    <span class="tech">${DATA.inputs.technique} &middot; depth ${DATA.inputs.depth}</span>
    <span class="chev" aria-hidden="true">&#9656;</span></summary>
    <ul>
      <li>Price comes from judgment, not from hours. Each feature is scored 1&ndash;5 on five
        factors &mdash; tech complexity, size, dependencies, uncertainty, risk &mdash; and the
        weighted score lands it in a price band, interpolated so neighbouring scores never
        jump a cliff. Uncertainty carries the heaviest weight and size the lightest.</li>
      <li>The feature prices are summed, scaled by one context multiplier for the delivery
        situation (codebase, stack familiarity, spec quality, compliance, client decisions),
        then loaded with project overheads &mdash; foundation, discovery, UX, QA, devops,
        docs, PM and integration &mdash; and a contingency sized by the average uncertainty
        and risk across the features.</li>
      <li>The spread is each feature's own uncertainty combined in quadrature, so a project
        of many small confident features is presented tighter than one large vague one. The
        presented range runs from the median to the 95th percentile, rounded.</li>
      <li>Tasks are still sized with three points (optimistic / most-likely / pessimistic)
        and PERT: E = (O + 4M + P) / 6, spread &sigma; = (P &minus; O) / 6. Those hours plan
        the delivery; they never convert into the price, and no duration is produced.</li>
      <li>The confidence badge is the worst task confidence on the largest feature &mdash;
        an estimate is only as strong as its critical path.</li>
    </ul>
    <p class="sources"><span>PERT and three-point estimation (US Navy, 1958), buffers, ranges,
      and risk registers — Atomic Object, atomicobject.com/client-resources/better-custom-software-estimates.</span>
    <span>Agent-assisted delivery shifts cost from writing code to resolving ambiguity — Kmino,
      kmino.io/blog/software-estimation-with-ai (practitioner observations, not peer-reviewed).</span>
    <span>Scoring and tier structure — Modular Earth solutions-architecture-agent,
      github.com/Modular-Earth-LLC/solutions-architecture-agent.</span></p></details>`;
}

function renderAll() {
  renderSummary();
  renderRoadmap();
  renderContainers();
  renderBreakdown();
  renderRegister();
  renderMethod();
}
bdDecode(location.hash.slice(1));
renderAll();

// The back button, and a hash pasted into the address bar, both arrive here.
// Our own writes use replaceState and so never fire this; the guard catches
// the file:// fallback, which does.
window.addEventListener('hashchange', () => {
  if (bdEncode() === location.hash.slice(1)) return;
  bdDecode(location.hash.slice(1));
  renderBreakdown();
});

document.getElementById('feature-table')?.addEventListener('click', onBreakdownClick);
document.getElementById('feature-table')?.addEventListener('change', onBreakdownChange);
document.getElementById('feature-table')?.addEventListener('keydown', onBreakdownKeydown);
// `toggle` does not bubble, so this one listens in the capture phase instead.
document.getElementById('feature-table')?.addEventListener('toggle', (e) => {
  if (!e.target.matches('[data-guide]')) return;
  bdState.guideOpen = e.target.open;
  bdSyncUrl(); // the fold does not re-render, so it syncs for itself
}, true);
document.getElementById('roadmap')?.addEventListener('click', onRoadmapClick);
document.getElementById('containers')?.addEventListener('mouseover', onPieHover);
document.getElementById('containers')?.addEventListener('mouseout', onPieHover);

// Which view you were reading travels with the link like the filters do. It
// rides the query string rather than the fragment because it picks a
// rendering of the whole page, not a position inside it — and it only ever
// switches the preview ON. A --client-only render has already had its
// internal markup stripped; no URL should look like it can put that back.
// The preview is a preview: the internal text is still in an internal page's
// DOM, hidden by CSS. `--client-only` is what actually removes it.
function setViewParam(on) {
  const p = new URLSearchParams(location.search);
  if (on) p.set('view', 'client');
  else p.delete('view');
  const q = p.toString();
  // A file:// page may refuse a history write; the toggle still works, the
  // URL just does not record it.
  try { history.replaceState(null, '', location.pathname + (q ? `?${q}` : '') + location.hash); }
  catch { /* the view is showing either way */ }
}

// The button names where it goes, not where it is. Guarded on the button's
// presence: a --client-only render has no toggle and its body class is the
// render, not a preview, so nothing here may touch it.
const viewToggle = document.getElementById('view-toggle');

function applyView(on) {
  document.body.classList.toggle('view-client', on);
  viewToggle.textContent = on ? 'internal view' : 'client view';
}

if (viewToggle) {
  if (new URLSearchParams(location.search).get('view') === 'client') applyView(true);
  viewToggle.addEventListener('click', () => {
    const on = !document.body.classList.contains('view-client');
    applyView(on);
    setViewParam(on);
  });
}

document.getElementById('theme-toggle')?.addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
});

// A collapsed <details> prints as its summary line only — force the method
// fold open on print so the paper copy still explains itself.
window.addEventListener('beforeprint', () => {
  document.querySelector('#method details.method-fold')?.setAttribute('open', '');
});
</script>
<!-- internal:start --><script>
// The price working: how the presented range was built from the feature
// prices, and which tier each feature landed in. Inside internal markers
// rather than merely marked data-internal, because redact.mjs strips the same
// fields out of the embedded data — so a --client-only file names them in
// neither its data nor its code, captions included, instead of shipping a
// renderer for numbers it no longer carries.
const WORKING = document.getElementById('price-working');

const workingRow = (label, value) => `<tr><td>${label}</td><td class="num">${value}</td></tr>`;

function overheadNote(overheads) {
  const lines = Object.entries(overheads.lines).map(([k, v]) => `${k} ${pctText(v)}`).join(' · ');
  return `${pctText(overheads.totalPct)} &mdash; ${lines}`;
}

// The arithmetic in the order it runs: feature prices, the situation they are
// delivered in, the work around them, the cushion, and the spread that made
// the range a range.
function buildUpTable(p) {
  const rows = [
    workingRow('Feature prices', fmtMoney(p.featurePoints)),
    workingRow('Context multiplier', `&times;${p.contextMultiplier}`),
    workingRow('Adjusted base', fmtMoney(p.adjustedBase)),
    workingRow('Overheads', `${overheadNote(p.overheads)} = ${fmtMoney(p.overheads.amount)}`),
    workingRow('Contingency', `${pctText(p.contingencyRate)} = ${fmtMoney(p.contingencyAmount)}`),
    workingRow('p50 / p80 / p95', `${fmtMoney(p.p50)} / ${fmtMoney(p.p80)} / ${fmtMoney(p.p95)}`),
  ].join('');
  return `<table><caption>Price build-up</caption><tbody>${rows}</tbody></table>`;
}

// Tier Reference: what each feature's score bought. The band is the price
// range the tier spans; the point is where this feature's score interpolated
// inside it.
function tierReferenceTable() {
  const rows = DATA.inputs.features.map((f) => {
    const c = DATA.computed.features[f.id];
    return `<tr><td>${esc(f.name)}</td><td class="score"><span class="tier ${c.tier.toLowerCase()}">${c.tier}</span></td>
      <td class="num">${fmtMoney(c.point)}</td>
      <td class="num">${fmtMoney(c.priceLow)} &ndash; ${fmtMoney(c.priceHigh)}</td></tr>`;
  }).join('');
  return `<table><caption>Tier Reference</caption><thead><tr><th>Feature</th>
    <th class="score">Tier</th><th class="num">Point</th><th class="num">Band</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// R50: no price build-up to show once this scope is unpriced (p50 === 0) —
// every row would read a bare zero, which the summary above already refuses
// to print.
if (WORKING && DATA.computed.price?.p50 && DATA.computed.price?.overheads) {
  WORKING.innerHTML = buildUpTable(DATA.computed.price) + (TIERED ? tierReferenceTable() : '');
}
</script><!-- internal:end -->
<!-- internal:start --><script>
// Feature breakdown → spreadsheet export. Clones the sample estimator
// workbook (base64 below), fills tab 1 with the rows the table currently
// shows, and leaves every tier/price formula live in-cell so the workbook
// keeps recomputing when a human edits the scores. Inside internal markers
// because the embedded workbook carries our pricing bands: a --client-only
// render strips this whole block and the button above degrades to a no-op
// hidden by the client-view CSS.
function xlsxContainer(f) {
  const id = containerOf(f.component);
  return CT_NAMES[id] ?? id ?? '';
}

// Every feature, whatever the breakdown filter shows: the workbook prices the
// project from the rows it gets, so a filtered subset would quote a total the
// page and the proposal do not (R60). Milestone is the primary order (roadmap
// order of first appearance), the table's current sort kept within each.
function exportRows() {
  const msRank = [...new Set(DATA.inputs.features.map((f) => f.milestone))];
  return bdSorted(breakdownData(), bdState.tab)
    .sort((a, b) => msRank.indexOf(a.milestone) - msRank.indexOf(b.milestone));
}

const XLSX_SOURCE = { rows: exportRows, container: xlsxContainer, levels: () => DATA.inputs.contextLevels };
<!-- slot:XLSX -->
</script><!-- internal:end -->
</body>
