<script>
/* Mirrors <title> into the rail so TITLE stays a single template slot, and so
   the rail is labelled even if the diagram bundles below fail to boot. */
document.getElementById('rail-title').textContent = document.title;
</script>

<!-- tabindex="-1" so the skip link can actually put focus here. Without it the
     link moves the viewport and leaves the tab position back up in the rail, so
     the next Tab returns the reader to the row they were escaping. -->
<main class="main" id="main-content" tabindex="-1">
  <article class="doc"><!-- slot:DOC --></article>
</main>

<div class="drawer-scrim" id="drawer-scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"
       aria-hidden="true">
  <header class="drawer__bar">
    <span class="drawer__label" id="drawer-title">Decision record</span>
    <span class="record-row__s" id="drawer-status" hidden></span>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="Close record" title="Close">
      <svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round"><path d="M4.5 4.5l9 9M13.5 4.5l-9 9"/></svg>
    </button>
  </header>
  <div class="drawer__body" id="drawer-body"></div>
</aside>

<script type="module"><!-- slot:LIKEC4_BUNDLE --></script>

<script type="module">
window.ARCH_DOCS_THEME = <!-- slot:THEME -->;
/* Guidance about the template, not claims about the documented system, so it
   sits outside the observed/stated/researched/proposed provenance rules. Data
   only: the loop below decides what to render from it. */
window.ARCH_DOCS_HELP = <!-- slot:SECTION_HELP -->;
<!-- slot:MERMAID_BUNDLE -->
var root = document.documentElement;
/* Live, not sampled once: a reader can turn reduced motion on mid-session and
   the router reads this on every jump. */
var reduced = matchMedia('(prefers-reduced-motion: reduce)');

function isDark() {
  var set = root.getAttribute('data-theme');
  return set ? set === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

/* Mermaid bakes colours into the SVG at render time, so the palette has to be
   chosen before rendering and the diagrams re-rendered whenever it changes.

   Merged over the shared palette, not swapped for it. `themeVariables` holds the
   elements: solid fills carrying their own text colour, which is what makes them
   legible either way — and it is what LikeC4 does, whose node fill samples as the
   same hex in light and dark with only the canvas flipping. `light` and `dark`
   hold the chrome that sits against that canvas and therefore has to flip with
   it: subgraph panels, edge-label chips, prose ink. Both blocks state the same
   keys, so a palette edit cannot land in one mode and leave a stale hex in the
   other — which is exactly how a cream page ended up with black boundary
   panels. */
function initMermaid() {
  var t = window.ARCH_DOCS_THEME;
  var vars = Object.assign({}, t.themeVariables, isDark() ? t.dark : t.light);
  mermaid.initialize({ theme: 'base', themeVariables: vars, layout: 'elk' });
}
/* LikeC4 renders its own SVG in a shadow root and takes light/dark from a
   color-scheme attribute — outer CSS custom properties reach the host and stop
   there, which is why the fill hue has to come from the model instead. Without
   this the toggle re-rendered mermaid and left every diagram in the mode it
   booted in: a light diagram sitting on a dark page. */
function syncDiagramTheme() {
  var mode = isDark() ? 'dark' : 'light';
  document.querySelectorAll('c4-view').forEach(function (v) {
    v.setAttribute('color-scheme', mode);
  });
}

mermaid.registerLayoutLoaders(elkLayouts);
initMermaid();
syncDiagramTheme();

var sidebar = document.getElementById('sidebar');
var scrim = document.getElementById('scrim');
var navToggle = document.getElementById('nav-toggle');

document.getElementById('theme-toggle').addEventListener('click', function () {
  var next = isDark() ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  /* Same guard as the boot script: the toggle still has to work for this session
     even where the preference cannot be kept for the next one. */
  try { localStorage.setItem('arch-docs-theme', next); } catch (e) { /* no store */ }
  /* One call per renderer, in one place. Split across two handlers is how the
     two diagram systems drifted out of step to begin with. */
  initMermaid();
  rerenderDiagrams();
  syncDiagramTheme();
});

function setDrawer(open) {
  sidebar.classList.toggle('is-open', open);
  scrim.classList.toggle('is-open', open);
  navToggle.setAttribute('aria-expanded', String(open));
}
navToggle.addEventListener('click', function () { setDrawer(!sidebar.classList.contains('is-open')); });
scrim.addEventListener('click', function () { setDrawer(false); });
addEventListener('keydown', function (e) { if (e.key === 'Escape') setDrawer(false); });

/* ---- reading progress ----
   Scoped to the open document, not to the whole set. Against 21 documents the
   line barely left the left edge while the reader worked through one of them,
   which is the unit they are actually reading. */
var progress = document.getElementById('progress');
var routePos = document.getElementById('route-pos');
var activePage = null;

function tick() {
  if (!activePage) return;
  var box = activePage.getBoundingClientRect();
  var span = box.height - innerHeight;
  var done = span > 0 ? Math.min(1, Math.max(0, -box.top / span)) : 1;
  progress.style.scale = done + ' 1';
  /* A section shorter than the viewport has nothing to scroll, and "100%" on a
     page the reader has not touched yet reads as a bug. The full line already
     says the whole section is on screen. */
  routePos.textContent = span > 0 ? Math.round(done * 100) + '%' : '';
}
addEventListener('scroll', tick, { passive: true });

/* ---- deep-link anchors and section explainers on every heading ---- */
/* One pass, and the order inside it matters: the anchor prepends a '#' to the
   heading, so the title has to be read before that happens or every lookup
   misses by one character. */
function helpPanel(entry) {
  var d = document.createElement('details');
  d.className = 'help';
  var body = document.createElement('div');
  body.className = 'help__body';
  body.appendChild(helpRow('What goes here', entry.what));
  body.appendChild(helpRow('Why it matters', entry.why));
  body.appendChild(helpRow('What good looks like', entry.good));
  d.appendChild(document.createElement('summary'));
  d.appendChild(body);
  return d;
}

function helpRow(label, text) {
  var p = document.createElement('p');
  var b = document.createElement('b');
  b.textContent = label + ' — ';
  p.appendChild(b);
  p.appendChild(document.createTextNode(text));
  return p;
}

var helpSeq = 0;
var helpSpine = null;

/* The markdown is the source of truth and it varies: a real set writes
   "## 1 Goals and Scope" where the asset's key is "Goals & Scope". Matched raw,
   all sixteen lookups missed and the page drew no buttons at all. Mirrors
   normTitle in scripts/lib/section-help.mjs — the leading number is dropped
   rather than matched on, because §3 is brownfield-only and a greenfield set
   renumbers everything after it. */
function helpKey(title) {
  return String(title)
    .replace(/^\s*\d+[.)]?\s+/, '')
    .replace(/&/g, 'and')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}

function spineEntry(title) {
  if (!helpSpine) {
    helpSpine = {};
    var src = (window.ARCH_DOCS_HELP || {}).spine || {};
    for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) {
      helpSpine[helpKey(k)] = src[k];
    }
  }
  return helpSpine[helpKey(title)];
}

/* Keyed on heading text, not on the id: slugify keeps both spaces around a
   stripped "&", and subheadings share one dedupe registry with h2, so the slug
   can shift under a heading without anything failing. Which heading levels get
   an explainer is settled at the heading loop below. */
function helpEntryFor(h, title) {
  var help = window.ARCH_DOCS_HELP || {};
  var page = h.closest('.page');
  var kind = page && page.dataset.kind;
  if (h.tagName === 'H1') return (help.companions || {})[kind];
  return h.tagName === 'H2' && kind === 'spine' ? spineEntry(title) : null;
}

/* aria-expanded says a state; aria-controls says what is in that state. The
   panel's summary is hidden because the button drives it, so this pairing is
   the only thing connecting the two for a screen reader. */
function helpButton(panel, title) {
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'help-btn';
  btn.textContent = '?';
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-controls', panel.id);
  btn.setAttribute('aria-label', 'What belongs in ' + title);
  return btn;
}

/* Read from the <details> element's own event rather than set inside the click
   handler, so anything that opens the panel without a click — not just this
   button — still leaves aria-expanded matching panel.open. */
function wireHelpToggle(btn, panel) {
  btn.addEventListener('click', function () {
    panel.open = !panel.open;
  });
  panel.addEventListener('toggle', function () {
    btn.setAttribute('aria-expanded', String(panel.open));
    /* Reading progress is measured from scroll offsets, so the panel changing
       the section's height leaves the readout stale until the next scroll. */
    tick();
  });
}

function injectSectionHelp(h, title) {
  var entry = helpEntryFor(h, title);
  if (!entry) return;
  var panel = helpPanel(entry);
  helpSeq += 1;
  panel.id = 'help-' + helpSeq;
  var btn = helpButton(panel, title);
  h.appendChild(btn);
  h.after(panel);
  wireHelpToggle(btn, panel);
}

/* h1 for a companion document's single explainer, h2 for the spine's sixteen.
   h3 is out of scope, and only the spine gets per-heading explainers: §14
   Decisions is itself a spine section and already the home for what a decision
   record is, so a per-record explainer would be that guidance seventeen times. */
document.querySelectorAll('.doc h1.doc-head, .doc h2[id], .doc h3[id]').forEach(function (h) {
  var title = h.textContent.trim();
  injectSectionHelp(h, title);
  if (h.tagName === 'H1') return;
  var a = document.createElement('a');
  a.className = 'anchor';
  a.href = '#' + h.id;
  a.textContent = '#';
  a.setAttribute('aria-label', 'Link to ' + title);
  h.prepend(a);
});

/* ---- tables get a scroll container so wide rows never blow out the column ---- */
document.querySelectorAll('.doc table').forEach(function (t) {
  var wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  var scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  t.replaceWith(wrap);
  wrap.appendChild(scroll);
  scroll.appendChild(t);
});

/* ---- view tabs: one system at several zoom levels, one panel at a time ---- */
document.querySelectorAll('.view-tabs').forEach(function (group) {
  var tabs = [].slice.call(group.querySelectorAll('.view-tab'));
  var panels = [].slice.call(group.querySelectorAll('.view-panel'));
  function select(n, focus) {
    tabs.forEach(function (t, i) {
      t.setAttribute('aria-selected', String(i === n));
      t.tabIndex = i === n ? 0 : -1;
    });
    panels.forEach(function (p, i) { p.hidden = i !== n; });
    if (focus) tabs[n].focus();
    dispatchEvent(new Event('resize'));
  }
  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () { select(i, false); });
    tab.addEventListener('keydown', function (e) {
      var step = e.key === 'ArrowRight' ? 1 : (e.key === 'ArrowLeft' ? -1 : 0);
      if (!step) return;
      e.preventDefault();
      select((i + step + tabs.length) % tabs.length, true);
    });
  });
});

/* ---- rail: filter ---- */
var filter = document.getElementById('nav-filter');
var sections = [].slice.call(document.querySelectorAll('.nav-sec'));
var groups = [].slice.call(document.querySelectorAll('.nav-group'));
var navEmpty = document.getElementById('nav-empty');

function titleOf(el, cls) { return el.querySelector(cls).textContent.toLowerCase(); }

/* Filtering force-opens whatever it hits, so the reader's own open/closed
   layout is stashed on the elements and restored when the box is cleared. */
function stashOpen() {
  sections.concat(groups).forEach(function (d) { d.dataset.wasOpen = d.open ? '1' : '0'; });
}
function restoreOpen(d) {
  if ('wasOpen' in d.dataset) d.open = d.dataset.wasOpen === '1';
}

/* Every document's own text, keyed by route. Filled once the router has sorted
   records from pages — see the note where it is populated. */
var docText = new Map();
function bodyHas(g, q) {
  var text = docText.get(g.dataset.route);
  return Boolean(text) && text.indexOf(q) !== -1;
}

/* The filter used to match heading labels and nothing else, which is wayfinding
   rather than search: a reader looking for "row-level security" found it only if
   somebody had made it a heading. Every page is already in the DOM, so matching
   the body costs an indexOf per document and no index at all.
   A body match promotes the whole document rather than any one heading — the
   phrase is somewhere in it, and Ctrl+F finds the line once the page is open. */
function filterGroup(g, q) {
  var links = [].slice.call(g.querySelectorAll('.nav-link'));
  var inTitle = Boolean(q) && titleOf(g, '.nav-group__title').indexOf(q) !== -1;
  var labelled = links.some(function (a) { return q && a.dataset.label.indexOf(q) !== -1; });
  var inBody = Boolean(q) && !inTitle && !labelled && bodyHas(g, q);
  var hit = inTitle || inBody;
  var found = 0;
  links.forEach(function (a) {
    var show = !q || hit || a.dataset.label.indexOf(q) !== -1;
    a.style.display = show ? '' : 'none';
    if (show) found += 1;
  });
  g.classList.toggle('is-body-hit', inBody);
  g.style.display = !q || found || hit ? '' : 'none';
  if (q) g.open = Boolean(found || hit); else restoreOpen(g);
  return found || (hit ? 1 : 0);
}

function filterSection(sec, q) {
  var hit = Boolean(q) && titleOf(sec, '.nav-sec__title').indexOf(q) !== -1;
  var found = 0;
  [].slice.call(sec.querySelectorAll('.nav-group')).forEach(function (g) {
    found += filterGroup(g, hit ? '' : q);
  });
  sec.style.display = !q || found || hit ? '' : 'none';
  if (q) sec.open = Boolean(found || hit); else restoreOpen(sec);
  return found;
}

/* The filter is the viewer's only wayfinding control and it was reachable by Tab
   or by mouse alone — from the bottom of a document that is a long way back.
   `/` is the convention in every documentation reader; ⌘K is the convention
   everywhere else, so both work. On a phone the rail has to come out first, or
   focus lands in a panel that is off screen. */
addEventListener('keydown', function (e) {
  var el = e.target;
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable;
  var slash = e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey;
  var palette = e.key === 'k' && (e.metaKey || e.ctrlKey);
  if (typing || !(slash || palette)) return;
  e.preventDefault();
  if (innerWidth <= 960) setDrawer(true);
  filter.focus();
  filter.select();
});

/* Escape clears the box and stops there. The same key closes the mobile rail and
   any open record, and a reader clearing a search asked for neither — so the
   event does not reach those handlers. An already-empty box hands focus back
   instead, which is the second press doing what the reader meant. */
filter.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  e.stopPropagation();
  if (!filter.value) { filter.blur(); return; }
  filter.value = '';
  filter.dispatchEvent(new Event('input'));
});

var stashed = false;
filter.addEventListener('input', function () {
  var q = filter.value.trim().toLowerCase();
  if (q && !stashed) { stashOpen(); stashed = true; }
  sidebar.classList.toggle('is-filtering', Boolean(q));
  var hits = 0;
  sections.forEach(function (sec) { hits += filterSection(sec, q); });
  navEmpty.style.display = q && !hits ? 'block' : 'none';
  if (!q) stashed = false;
});

/* ---- rail: scroll spy ---- */
var links = [].slice.call(document.querySelectorAll('.nav-link'));
var byId = {};
var targets = [];
links.forEach(function (a) {
  var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
  if (!el) return;
  byId[el.id] = a;
  targets.push(el);
});
document.querySelectorAll('.doc .doc-head[id]').forEach(function (el) { targets.push(el); });

var crumb = document.getElementById('crumb');
var current = null;

function setCrumb(parts) {
  crumb.innerHTML = '';
  parts.filter(Boolean).forEach(function (part, i) {
    if (i) crumb.appendChild(Object.assign(document.createElement('span'), { textContent: '/' }));
    crumb.appendChild(part.strong
      ? Object.assign(document.createElement('b'), { textContent: part.text })
      : document.createTextNode(part.text));
  });
}

function clearActive() {
  links.forEach(function (l) { l.classList.remove('is-active'); });
  groups.forEach(function (g) { g.classList.remove('is-current'); });
  sections.forEach(function (s) { s.classList.remove('is-current'); });
}

// A hit inside a collapsed section is invisible, so open both levels.
function revealIn(sec, group) {
  if (sec) { sec.classList.add('is-current'); if (!filter.value) sec.open = true; }
  if (group) {
    group.classList.add('is-current');
    if (!filter.value) group.open = true;
  }
}

function activate(el) {
  if (el === current) return;
  current = el;
  var a = byId[el.id];
  clearActive();

  var group = a ? a.closest('.nav-group')
    : document.querySelector('.nav-group[data-doc="' + CSS.escape(el.id) + '"]');
  var sec = group ? group.closest('.nav-sec') : null;
  revealIn(sec, group);
  if (a) {
    a.classList.add('is-active');
    if (innerWidth > 960) a.scrollIntoView({ block: 'nearest' });
  }
  setCrumb([
    sec && { text: sec.querySelector('.nav-sec__title').textContent },
    group && { text: group.querySelector('.nav-group__title').textContent, strong: true },
    a && { text: a.textContent },
  ]);
}

var visible = new Set();
/* The spy's top edge is the bar the reader is looking under, plus the 8px the
   headings already clear it by. Read from the property the bar is sized by
   rather than restated as a literal that goes stale the moment it changes. */
var topbarH = parseFloat(getComputedStyle(root).getPropertyValue('--topbar-h')) || 52;
var spy = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (e.isIntersecting) visible.add(e.target); else visible.delete(e.target);
  });
  if (!visible.size) return;
  var ordered = targets.filter(function (t) { return visible.has(t); });
  if (ordered.length) activate(ordered[0]);
}, { rootMargin: '-' + (topbarH + 8) + 'px 0px -72% 0px', threshold: 0 });
targets.forEach(function (t) { spy.observe(t); });

links.forEach(function (a) {
  a.addEventListener('click', function () { if (innerWidth <= 960) setDrawer(false); });
});

/* ---- page bars ----
   Every document gets a bar: where it sits in its section, and prev/next across
   the section's other documents. A document inside a section that ships an index
   also gets a link back to it. The pages stay in the DOM whether shown or not,
   which is what lets an index search their text after hiding them from the
   browser's own find. */
var routed = [].slice.call(document.querySelectorAll('.doc-section[data-routed]'));
var bodyText = new Map();

function pagesOf(sec) { return [].slice.call(sec.children); }

function recordsOf(sec) {
  var landing = document.getElementById(sec.dataset.landing);
  return pagesOf(sec).filter(function (p) { return p !== landing; });
}

function chip(label, href, flag) {
  var a = document.createElement('a');
  a.className = 'page-chip';
  a.textContent = label;
  if (href) a.href = '#' + href;
  else a.setAttribute('aria-disabled', 'true');
  if (flag) a.setAttribute(flag, '');
  return a;
}

function stepsEl(siblings, i) {
  var steps = document.createElement('div');
  steps.className = 'page-steps';
  steps.appendChild(chip('‹ Prev', siblings[i - 1] && siblings[i - 1].id, 'data-prev'));
  steps.appendChild(chip('Next ›', siblings[i + 1] && siblings[i + 1].id, 'data-next'));
  return steps;
}

function barEl(siblings, i, landingId) {
  var bar = document.createElement('div');
  bar.className = 'page-bar';
  if (landingId) bar.appendChild(chip('‹ All records', landingId, 'data-back'));
  var pos = document.createElement('span');
  pos.className = 'page-pos';
  pos.textContent = (i + 1) + ' / ' + siblings.length;
  bar.append(pos, stepsEl(siblings, i));
  return bar;
}

function snippetEl(text, q) {
  var at = text.toLowerCase().indexOf(q);
  var body = document.createElement('span');
  var mark = document.createElement('mark');
  mark.textContent = text.slice(at, at + q.length);
  body.append('…' + text.slice(Math.max(0, at - 55), at), mark,
    text.slice(at + q.length, at + q.length + 95) + '…');
  return body;
}

function hitEl(page, q) {
  var a = document.createElement('a');
  a.className = 'record-hit';
  a.href = '#' + page.id;
  var title = document.createElement('b');
  title.textContent = page.dataset.title;
  a.append(title, snippetEl(bodyText.get(page), q));
  return a;
}

/* An empty result used to be indistinguishable from a query too short to run,
   from a broken search, and from a section with no records — all four rendered
   as nothing at all. */
function emptyEl(q) {
  var el = document.createElement('p');
  el.className = 'record-empty';
  el.textContent = 'No record contains “' + q + '”';
  return el;
}

function searchEl(records, hits) {
  var box = document.createElement('div');
  box.className = 'record-search';
  var input = document.createElement('input');
  input.type = 'search';
  input.setAttribute('aria-label', 'Search the full text of every record');
  input.placeholder = 'Search all ' + records.length + ' records…';
  box.appendChild(input);
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();
    hits.textContent = '';
    if (q.length < 2) return;
    var found = 0;
    records.forEach(function (p) {
      if (bodyText.get(p).toLowerCase().indexOf(q) === -1) return;
      hits.appendChild(hitEl(p, q));
      found += 1;
    });
    if (!found) hits.appendChild(emptyEl(input.value.trim()));
  });
  return box;
}

/* Each record states its own status under a Status heading, so the index can
   total them without the renderer having to parse anything. The deep-link
   anchor prepends a '#' to every heading, hence the strip. */
/* Only the leading word. A real status line carries its qualifiers with it —
   "Accepted — partially supersedes ADR-0008 (the src/kit/ line only)" — and
   tallying the whole string gives one bucket per record instead of a total. */
function statusHeadOf(page) {
  var head = [].slice.call(page.querySelectorAll('h2')).filter(function (h) {
    return h.textContent.replace('#', '').trim().toLowerCase() === 'status';
  })[0];
  var body = head && head.nextElementSibling;
  return body && body.tagName === 'P' ? body.textContent.trim() : '';
}

function statusOf(page) {
  var text = statusHeadOf(page);
  if (text) return (text.match(/^[A-Za-z]+/) || [''])[0].toLowerCase();
  /* Not every record uses a Status heading: one writes "**Status:** Accepted" as
     an inline label in its header block. Only the opening of the record is
     searched, so a later mention of the word cannot be mistaken for the field. */
  var label = page.textContent.slice(0, 700).match(/Status:\s*([A-Za-z]+)/);
  return label ? label[1].toLowerCase() : '';
}

function summaryEl(records) {
  var tally = new Map();
  records.forEach(function (p) {
    var status = statusOf(p) || 'unrecorded';
    tally.set(status, (tally.get(status) || 0) + 1);
  });
  var parts = Array.from(tally).sort(function (a, b) { return b[1] - a[1]; });
  var el = document.createElement('p');
  el.className = 'record-summary';
  el.textContent = records.length + ' records · ' + parts.map(function (e) {
    return e[1] + ' ' + e[0];
  }).join(' · ');
  return el;
}

/* The author's own index is prose, and prose goes stale. This set's
   docs/adr/README.md lists four records by filenames the repository never had —
   behind an index-routed section that hides the other eleven completely. So the
   links are counted, and the list is generated only when they fall short. */
function linksAll(landing, records) {
  var seen = {};
  var found = 0;
  landing.querySelectorAll('a[href^="#"]').forEach(function (a) {
    /* Resolved through the element, not string-matched: a rewritten link points
       at the target's H1 id, which is the page id without its page- prefix. */
    var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
    var page = el && el.closest('.page');
    if (page && !seen[page.id] && records.indexOf(page) !== -1) {
      seen[page.id] = 1;
      found += 1;
    }
  });
  return found >= records.length;
}

function rowEl(page, i) {
  var a = document.createElement('a');
  a.className = 'record-row';
  a.href = '#' + page.id;
  var n = document.createElement('span');
  n.className = 'record-row__n';
  n.textContent = i + 1;
  var title = document.createElement('b');
  title.textContent = page.dataset.title;
  var status = document.createElement('span');
  status.className = 'record-row__s';
  status.textContent = statusOf(page) || 'unrecorded';
  /* The pill is painted from the status it shows, so the two records still open in
     a set of fifteen stop looking like the thirteen that are settled. */
  status.dataset.status = status.textContent;
  a.append(n, title, status);
  return a;
}

function listEl(records) {
  var list = document.createElement('div');
  list.className = 'record-list';
  var label = document.createElement('div');
  label.className = 'eyebrow';
  label.textContent = 'Every record';
  list.appendChild(label);
  records.forEach(function (p, i) { list.appendChild(rowEl(p, i)); });
  return list;
}

function equipSection(sec) {
  var records = recordsOf(sec);
  records.forEach(function (p) { bodyText.set(p, p.textContent.replace(/\s+/g, ' ')); });
  var landing = document.getElementById(sec.dataset.landing);
  var hits = document.createElement('div');
  hits.className = 'record-hits';
  /* The index's own opening paragraph explains what the records are, so it keeps
     its place directly under the title; the controls go below it. */
  var head = landing.querySelector('.doc-head');
  var lead = head.nextElementSibling;
  var at = lead && lead.tagName === 'P' ? lead : head;
  if (!linksAll(landing, records)) at.after(listEl(records));
  at.after(hits);
  at.after(searchEl(records, hits));
  at.after(summaryEl(records));
}

/* ---- page routes ----
   A 21-document scroll is not a page. Every document is its own page with its
   own route and its own progress. Sections are the grouping the rail shows;
   prev/next walks the section, and a section that ships an index is browsed
   from it.

   Two hash forms, because every anchor the renderer writes is a bare element id
   and rewriting them all would be the same work twice. A leading slash names a
   route; anything else is an id, and the router opens whichever page holds it. */
var docSections = [].slice.call(document.querySelectorAll('.doc-section'));
var docPages = [].slice.call(document.querySelectorAll('.page[data-route]'));
var byRoute = {};
docPages.forEach(function (p) { byRoute[p.dataset.route] = p; });

function routeParts() {
  var raw = decodeURIComponent((location.hash || '').slice(1));
  return raw.charAt(0) === '/' ? { slug: raw.slice(1), id: '' } : { slug: '', id: raw };
}

function landingFor(sec) {
  return sec.dataset.landing ? document.getElementById(sec.dataset.landing) : pagesOf(sec)[0];
}

/* A record is not a page of the document — it opens over whichever page referenced
   it (§14 Decisions, in practice) and closing puts the reader back on the row they
   clicked. So its section never becomes the layout, and the page router has to
   leave its pages alone: hiding one would open an empty drawer. */
var drawerSections = docSections.filter(function (s) { return 'drawer' in s.dataset; });
var pageSections = docSections.filter(function (s) { return !('drawer' in s.dataset); });
var recordHome = new Map();
drawerSections.forEach(function (sec) {
  pagesOf(sec).forEach(function (p) { recordHome.set(p, sec); });
});
var isRecord = function (page) { return recordHome.has(page); };

function pageFor(parts) {
  var el = parts.id && document.getElementById(parts.id);
  var owner = el && el.closest('.page');
  if (owner && !isRecord(owner)) return owner;
  var routed = byRoute[parts.slug];
  if (routed && !isRecord(routed)) return routed;
  return activePage || landingFor(pageSections[0]);
}

function recordFor(parts) {
  var el = parts.id && document.getElementById(parts.id);
  var owner = el && el.closest('.page');
  if (owner && isRecord(owner)) return owner;
  var routed = byRoute[parts.slug];
  return routed && isRecord(routed) ? routed : null;
}

function showPage(page) {
  var sec = page.parentNode;
  docSections.forEach(function (s) { s.hidden = s !== sec; });
  docPages.forEach(function (p) { if (!isRecord(p)) p.hidden = p !== page; });
  /* The rail is the only way to change document, so the router owns which rows
     are open. A row expanded over a page that is not in the layout is a lie. */
  sections.forEach(function (n) { n.open = n.dataset.sec === sec.dataset.slug; });
  groups.forEach(function (g) { g.open = g.dataset.route === page.dataset.route; });
  activePage = page;
  /* A <c4-view> revealed from display:none has never had a box to fit itself
     into, and the webcomponent only refits on resize. */
  dispatchEvent(new Event('resize'));
  if (window.pinEdgeChips) setTimeout(window.pinEdgeChips, 300);
}

var drawerEl = document.getElementById('drawer');
var drawerScrim = document.getElementById('drawer-scrim');
var drawerBody = document.getElementById('drawer-body');
var drawerTitle = document.getElementById('drawer-title');
var drawerStatus = document.getElementById('drawer-status');
var drawerClose = document.getElementById('drawer-close');
var openRecord = null;
var returnFocus = null;

/* "ADR-0002", not "ADR-0002: Multi-tenancy via shared database with row-level
   org_id and Postgres RLS". The record's own H1 is two lines below the bar. */
function recordLabel(title) {
  var head = (title || 'Record').split(':')[0].trim();
  return head.length > 40 ? head.slice(0, 39) + '…' : head;
}

/* `inert` rather than a hand-rolled tab trap: it takes the page out of the tab
   order and the accessibility tree in one property, which is what aria-modal was
   claiming and nothing was enforcing. */
/* The skip link is in the list because it sits outside .main and would otherwise
   stay reachable from behind the scrim — a skip link that fires while a record
   is open lands the reader on a page they cannot see. */
function setBehindInert(on) {
  [document.querySelector('.main'), sidebar, document.querySelector('.topbar'),
    document.querySelector('.skip')]
    .forEach(function (el) { if (el) el.inert = on; });
}

/* Moved, not cloned. A clone duplicates every heading id inside the record, and
   from then on getElementById resolves to whichever copy comes first in the
   document — so half the anchors in the drawer would scroll the page behind it. */
function openDrawer(page) {
  if (openRecord === page) return;
  var from = openRecord ? returnFocus : document.activeElement;
  closeDrawer();
  returnFocus = from;
  page.hidden = false;
  drawerBody.appendChild(page);
  drawerBody.scrollTop = 0;
  drawerTitle.textContent = recordLabel(page.dataset.title);
  var status = statusOf(page);
  drawerStatus.hidden = !status;
  drawerStatus.textContent = status;
  drawerStatus.dataset.status = status;
  drawerEl.setAttribute('aria-label', page.dataset.title || 'Record');
  drawerEl.classList.add('is-open');
  drawerEl.setAttribute('aria-hidden', 'false');
  drawerScrim.classList.add('is-open');
  openRecord = page;
  setBehindInert(true);
  drawerClose.focus();
}

function closeDrawer() {
  drawerEl.classList.remove('is-open');
  drawerEl.setAttribute('aria-hidden', 'true');
  drawerScrim.classList.remove('is-open');
  setBehindInert(false);
  if (!openRecord) return;
  openRecord.hidden = true;
  recordHome.get(openRecord).appendChild(openRecord);
  openRecord = null;
  /* Back to the row that opened it. Without this the reader is returned to the top
     of the document by the browser's own fallback, having lost the list they were
     working through. */
  if (returnFocus && returnFocus.isConnected) returnFocus.focus();
  returnFocus = null;
}

/* Closing goes through the hash, so the panel and the address never disagree:
   Escape, the scrim and the × all land on the page's own route, and Back does the
   same thing by the ordinary route. */
function leaveRecord() {
  var route = activePage && activePage.dataset.route;
  closeDrawer();
  if (route) location.hash = '#/' + route;
}

/* The browser scrolls to a fragment before the router can reveal it, so a deep
   link into a hidden page lands nowhere. Re-run the jump once it is shown. */
function navigate(jump) {
  var parts = routeParts();
  var record = recordFor(parts);
  var page = pageFor(parts);
  /* Before showPage, which is what assigns activePage. A route that resolves to
     the page already on screen is not a move, and starting it at the top is how
     closing a record threw the reader from §14 back to §1 — the drawer leaves by
     the host page's own route, and Back does the same. */
  var moved = page !== activePage;
  showPage(page);
  tick();
  /* Order matters: the host page has to be in the layout before the record goes
     over it, or a cold load at #/0002 opens the drawer onto nothing. */
  if (record) { openDrawer(record); return; }
  closeDrawer();
  if (!jump) return;
  var el = parts.id && document.getElementById(parts.id);
  /* Instant when the router changed the page, smooth when it did not.
     `scroll-behavior: smooth` cannot tell the two apart, so a deep link into
     another document used to animate the whole way there — through content the
     reader never asked to see, and past the top of the document they did. An
     anchor inside the page already on screen is a short deliberate move and
     keeps its glide. Reduced motion takes even that back: passing `behavior`
     explicitly outranks the CSS rule that used to cover this. */
  var how = (moved || reduced.matches) ? 'instant' : 'smooth';
  if (!el) { if (moved) scrollTo({ top: 0, behavior: 'instant' }); return; }
  /* A link to a document scrolls to the page so its prev/next bar stays on
     screen. A link to a heading inside it still lands on that heading. */
  (el.classList.contains('doc-head') ? page : el).scrollIntoView({ behavior: how });
}

function goTo(route) {
  if (innerWidth <= 960) setDrawer(false);
  if (routeParts().slug !== route) location.hash = '#/' + route;
}

/* preventDefault also stops <summary> toggling, which is the point: the row for
   the page on screen cannot be collapsed, because collapsing it would leave the
   reader no way back into the document they are looking at. */
function wireRow(row, head) {
  row.querySelector(head).addEventListener('click', function (e) {
    e.preventDefault();
    goTo(row.dataset.route);
  });
}

sections.forEach(function (n) { wireRow(n, '.nav-sec__head'); });
groups.forEach(function (g) { if (g.dataset.route) wireRow(g, '.nav-group__head'); });

/* Index pages first: the generated list reads each record's status out of its
   text, and the search stashes that text. A bar prepended before either would
   put "‹ ALL RECORDS 3 / 15 ‹ PREV NEXT ›" at the head of every record — inside
   the 700 characters the status is looked for, and inside every search hit. */
/* Before the bars, for the same reason the index search is: a bar contributes
   "‹ All records 3 / 15 ‹ Prev Next ›" to every page, and captured after it those
   become words the filter matches in every document at once.
   Records are left out — they have no rail row to promote, and their section's
   own index already searches them. Between the two, nothing in the set is
   unsearchable. */
docPages.forEach(function (p) {
  if (isRecord(p)) return;
  docText.set(p.dataset.route, p.textContent.replace(/\s+/g, ' ').toLowerCase());
});

routed.forEach(equipSection);

docSections.forEach(function (sec) {
  /* An index is not part of its own walk: it is the thing prev/next comes back
     to, so the records number 1..15 rather than the index numbering itself 1. */
  var landing = sec.dataset.landing;
  var walk = landing ? recordsOf(sec) : pagesOf(sec);
  walk.forEach(function (p, i) { p.prepend(barEl(walk, i, landing || '')); });
});
drawerClose.addEventListener('click', leaveRecord);
drawerScrim.addEventListener('click', leaveRecord);
addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && openRecord) leaveRecord();
});

/* A link to a record could be left to the id form — the router resolves it either
   way — but then the address bar says #doc-adr-0002-multi-tenancy while the panel
   says ADR 0002, and neither is the route somebody would paste. Listening on
   document rather than .doc because an open record is no longer inside it, and one
   record links to another. */
addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
  var page = el && el.closest('.page');
  if (!page || !isRecord(page)) return;
  e.preventDefault();
  if (routeParts().slug === page.dataset.route) openDrawer(page);
  else location.hash = '#/' + page.dataset.route;
});

addEventListener('hashchange', function () { navigate(true); });
addEventListener('resize', tick);
navigate(Boolean(location.hash));

/* ---- diagrams ---- */
var mermaidEls = [];
function rerenderDiagrams() { mermaidEls.forEach(renderMermaid); }

/* mermaid measures a diagram in a scratch div it appends to the body under
   'd' + id, and leaves it there when the parse throws. */
function dropScratch(id) {
  var junk = document.getElementById('d' + id);
  if (junk) junk.remove();
}

/* Left alone, a rejected render is silent: the element keeps the source text it
   was seeded with, so a syntax error renders as a slab of mermaid DSL inside a
   diagram frame — which reads as a code block somebody meant to put there. */
function showDiagramError(el, err) {
  var msg = document.createElement('p');
  msg.className = 'diagram-error';
  msg.textContent = 'Diagram failed to render — ' + ((err && err.message) || err);
  el.replaceChildren(msg);
}

// Mermaid pins the SVG to its natural width (~300px for an ER diagram), which
// leaves labels unreadable in a full-width shell. The viewBox lets it scale.
function fitSvg(svg) {
  if (!svg.getAttribute('viewBox')) return;
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.style.width = '100%';
  svg.style.height = 'auto';
  svg.style.maxWidth = '100%';
  svg.style.maxHeight = '72vh';
}

async function renderMermaid(el) {
  var code = el.dataset.src || el.textContent.trim();
  if (!code) return;
  el.dataset.src = code;
  var id = 'd' + Math.random().toString(36).slice(2);
  var out;
  try {
    out = await mermaid.render(id, code);
  } catch (err) {
    dropScratch(id);
    showDiagramError(el, err);
    return;
  }
  var svg = new DOMParser().parseFromString(out.svg, 'text/html').body.querySelector('svg');
  if (!svg) return;
  fitSvg(svg);
  el.replaceChildren(svg);
}

var ICONS = {
  'zoom-in': '<svg viewBox="0 0 18 18"><circle cx="7.8" cy="7.8" r="5"/><path d="M11.4 11.4 16 16M7.8 5.8v4M5.8 7.8h4"/></svg>',
  'zoom-out': '<svg viewBox="0 0 18 18"><circle cx="7.8" cy="7.8" r="5"/><path d="M11.4 11.4 16 16M5.8 7.8h4"/></svg>',
  'expand': '<svg viewBox="0 0 18 18"><path d="M11 2h5v5M7 16H2v-5M16 2l-6 6M2 16l6-6"/></svg>',
  'fullscreen': '<svg viewBox="0 0 18 18"><path d="M2 6.5V2h4.5M11.5 2H16v4.5M16 11.5V16h-4.5M6.5 16H2v-4.5"/></svg>',
  'exit': '<svg viewBox="0 0 18 18"><path d="M6.5 2v4.5H2M16 6.5h-4.5V2M11.5 16v-4.5H16M2 11.5h4.5V16"/></svg>',
  /* A pushpin rather than the usual "dock to side" bracket: the bracket is the
     same shape as expand and exit-fullscreen already in this bar, and three
     rectangles-with-arrows is a toolbar nobody can read at 14px. */
  'pin': '<svg viewBox="0 0 18 18"><path d="M11.2 2.4 15.6 6.8M12.4 3.6 8.6 6 4.9 7.1l6 6L12 9.4l2.4-3.8M6.2 11.8 2.6 15.4"/></svg>',
};

function buildToolbar() {
  var t = document.createElement('div');
  t.className = 'diagram-toolbar';
  t.innerHTML =
    '<button type="button" data-zoom-in aria-label="Zoom in" title="Zoom in">' + ICONS['zoom-in'] + '</button>' +
    '<button type="button" data-zoom-out aria-label="Zoom out" title="Zoom out">' + ICONS['zoom-out'] + '</button>' +
    '<button type="button" data-zoom-reset aria-label="Reset zoom, currently 100%" title="Reset zoom">100%</button>' +
    '<button type="button" data-pin aria-pressed="false" aria-label="Pin beside the text" title="Pin beside the text">' + ICONS.pin + '</button>' +
    '<button type="button" data-expand aria-pressed="false" aria-label="Expand" title="Expand">' + ICONS.expand + '</button>' +
    '<button type="button" data-fullscreen aria-label="Fullscreen" title="Fullscreen">' + ICONS.fullscreen + '</button>' +
    '<button type="button" data-exit-fullscreen aria-label="Exit fullscreen" title="Exit fullscreen">' + ICONS.exit + '</button>';
  return t;
}

/* Pinning reserves a 380px gutter, so the column narrows and every paragraph in
   the document reflows. The placeholder keeps the *diagram's* space, but nothing
   keeps the reader's: on the 20-document EOS set the text under the cursor moved
   48px — two lines — which on a page whose whole job is being read is the change
   arriving as a jolt. The fixture set is too short to show it; it took a real
   render to measure. So the first block below the top bar is treated as the
   anchor and its position restored afterwards.
   `behavior: 'instant'` because html sets scroll-behavior: smooth, and a
   correction that animates is the jump plus a slide. */
function readingAnchor() {
  var els = document.querySelectorAll('.main p, .main li, .main h2, .main h3');
  for (var i = 0; i < els.length; i += 1) {
    var r = els[i].getBoundingClientRect();
    if (r.height && r.top > 60) return els[i];
  }
  return null;
}

function keepingPlace(change) {
  var el = readingAnchor();
  var before = el && el.getBoundingClientRect().top;
  change();
  if (!el) return;
  scrollBy({ top: el.getBoundingClientRect().top - before, behavior: 'instant' });
}

/* Measured while the shell is still in flow, because once it is fixed its
   offsetHeight is the pane's, not the space it left behind. */
function slotFor(shell) {
  var slot = document.createElement('div');
  slot.className = 'diagram-slot';
  slot.style.height = shell.offsetHeight + 'px';
  shell.parentNode.insertBefore(slot, shell);
}

/* Returns the shell it released, which is how pinDiagram tells "pin this one"
   from "the reader clicked the pin that is already down". Focus is deliberately
   not moved: the pin button may be a screen away by now, and focusing it would
   drag the viewport back there — the opposite of what a reader pressing Escape
   over the prose was asking for. */
function unpinDiagram() {
  var shell = document.querySelector('.diagram-shell.is-pinned');
  if (!shell) return null;
  shell.classList.remove('is-pinned');
  document.body.classList.remove('has-pin');
  var slot = shell.previousElementSibling;
  if (slot && slot.classList.contains('diagram-slot')) slot.remove();
  shell.querySelector('[data-pin]').setAttribute('aria-pressed', 'false');
  if (shell.archDocsSync) shell.archDocsSync();
  return shell;
}

/* One pane, so pinning a second diagram releases the first. Two would need two
   gutters, and the column has one to give. */
function pinDiagram(shell) {
  if (unpinDiagram() === shell) return;
  slotFor(shell);
  shell.classList.add('is-pinned');
  document.body.classList.add('has-pin');
  shell.querySelector('[data-pin]').setAttribute('aria-pressed', 'true');
  if (shell.archDocsSync) shell.archDocsSync();
}

/* There is something to pan once the diagram is bigger than its box, or once the
   box is the whole screen. Below that, panning is a promise the diagram cannot
   keep — and claiming the touch gesture for it costs the reader their scroll. */
function pannable(shell, zoom) {
  return zoom > 1 || shell.classList.contains('is-expanded')
    || document.fullscreenElement === shell;
}

var PAN_KEYS = { ArrowLeft: [1, 0], ArrowRight: [-1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] };

/* How far the canvas may travel: the overhang, meaning how far the scaled canvas
   sticks out past the viewport on each side. So the content edges can be brought
   to the frame edges and no further. Below zoom 1 there is no overhang, the
   limit is zero, and the diagram stays parked in the middle — which is right,
   because at that size there is nothing off screen to go and look at. */
function panLimit(viewport, canvas, zoom) {
  return {
    x: Math.max(0, (canvas.offsetWidth * zoom - viewport.clientWidth) / 2),
    y: Math.max(0, (canvas.offsetHeight * zoom - viewport.clientHeight) / 2),
  };
}

/* Pointer events, not the mouse pair: the mouse events never fire for touch, so
   a diagram on a phone could be zoomed and then not moved. Capture keeps the
   drag bound to the element it started in, which also retires the two
   document-level listeners this used to add once per diagram — a page with a
   dozen diagrams was running a dozen mousemove handlers on every move. */
function wirePan(viewport, ctl) {
  var drag = null;
  var end = function () { drag = null; viewport.classList.remove('is-panning'); };
  viewport.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.diagram-toolbar')) return;
    if (!viewport.classList.contains('is-pannable')) return;
    drag = { x: e.clientX, y: e.clientY };
    viewport.setPointerCapture(e.pointerId);
    viewport.classList.add('is-panning');
  });
  viewport.addEventListener('pointermove', function (e) {
    if (!drag) return;
    ctl.panBy(e.clientX - drag.x, e.clientY - drag.y);
    drag = { x: e.clientX, y: e.clientY };
  });
  viewport.addEventListener('pointerup', end);
  viewport.addEventListener('pointercancel', end);
}

/* A zoomed diagram was reachable by keyboard and then frozen: the toolbar takes
   focus and zooms, and nothing moved the canvas afterwards. */
function wireKeys(viewport, ctl) {
  viewport.addEventListener('keydown', function (e) {
    var step = PAN_KEYS[e.key];
    /* Not pannable means the whole diagram is already in its box, so the arrows
       belong to the page. Taking them anyway traps a reader who tabbed in here
       on their way down the document. */
    if (step && !viewport.classList.contains('is-pannable')) return;
    if (step) ctl.panBy(step[0] * 48, step[1] * 48);
    else if (e.key === '+' || e.key === '=') ctl.zoomBy(1.2);
    else if (e.key === '-') ctl.zoomBy(1 / 1.2);
    else if (e.key === '0') ctl.reset();
    else return;
    e.preventDefault();
  });
}

/* The shell arrives holding the raw diagram; it leaves holding a toolbar over a
   viewport over a canvas over that same content, so the pan/zoom transform has a
   single element to write to. */
function buildStage(shell) {
  var toolbar = buildToolbar();
  var viewport = document.createElement('div');
  viewport.className = 'diagram-viewport';
  viewport.tabIndex = 0;
  viewport.setAttribute('role', 'group');
  viewport.setAttribute('aria-label',
    'Diagram. Arrow keys pan, plus and minus zoom, 0 resets.');
  var canvas = document.createElement('div');
  canvas.className = 'diagram-canvas';
  var content = shell.firstElementChild;
  shell.replaceChildren(toolbar, viewport);
  viewport.appendChild(canvas);
  canvas.appendChild(content);
  return { toolbar: toolbar, viewport: viewport, canvas: canvas };
}

// The readout doubles as the reset button, so its accessible name has to carry
// the live value as well as the action.
function showZoom(readout, zoom) {
  var pct = Math.round(zoom * 100) + '%';
  readout.textContent = pct;
  readout.setAttribute('aria-label', 'Reset zoom, currently ' + pct);
}

/* Owns the zoom and pan state. */
function makeControls(stage, shell) {
  var viewport = stage.viewport, canvas = stage.canvas;
  var readout = stage.toolbar.querySelector('[data-zoom-reset]');
  var zoom = 1, panX = 0, panY = 0;
  /* Clamped here rather than in each of zoom, pan and reset: this is the one
     place the transform is written, so it is the one place that cannot be
     forgotten. Zooming back out re-centres for free. */
  function clampPan() {
    var lim = panLimit(viewport, canvas, zoom);
    panX = Math.min(lim.x, Math.max(-lim.x, panX));
    panY = Math.min(lim.y, Math.max(-lim.y, panY));
  }
  function apply() {
    clampPan();
    canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
    showZoom(readout, zoom);
  }
  function sync() { viewport.classList.toggle('is-pannable', pannable(shell, zoom)); }
  return {
    sync: sync,
    zoomBy: function (f) { zoom = Math.min(4, Math.max(0.25, zoom * f)); apply(); sync(); },
    panBy: function (dx, dy) { panX += dx; panY += dy; apply(); },
    reset: function () { zoom = 1; panX = 0; panY = 0; apply(); sync(); },
  };
}

function wireToolbar(stage, shell, ctl) {
  var toolbar = stage.toolbar;
  toolbar.querySelector('[data-zoom-in]').onclick = function () { ctl.zoomBy(1.2); };
  toolbar.querySelector('[data-zoom-out]').onclick = function () { ctl.zoomBy(1 / 1.2); };
  toolbar.querySelector('[data-zoom-reset]').onclick = ctl.reset;
  toolbar.querySelector('[data-pin]').onclick = function () {
    keepingPlace(function () { pinDiagram(shell); });
  };
  toolbar.querySelector('[data-expand]').onclick = function () {
    var on = !shell.classList.contains('is-expanded');
    shell.classList.toggle('is-expanded', on);
    this.setAttribute('aria-pressed', String(on));
    ctl.sync();
  };
  toolbar.querySelector('[data-fullscreen]').onclick = function () { shell.requestFullscreen().catch(function () {}); };
  toolbar.querySelector('[data-exit-fullscreen]').onclick = function () { document.exitFullscreen(); };
  shell.addEventListener('fullscreenchange', ctl.sync);
}

// Ctrl/Cmd held: the gesture is a zoom, not a page scroll.
function wireWheel(viewport, ctl) {
  viewport.addEventListener('wheel', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    ctl.zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1);
  }, { passive: false });
}

function markDiagramKind(shell, canvas) {
  if (canvas.querySelector('c4-view')) shell.classList.add('is-c4');
  var mermaidEl = canvas.querySelector('.mermaid-canvas');
  if (!mermaidEl) return;
  shell.classList.add('is-mermaid');
  mermaidEls.push(mermaidEl);
  renderMermaid(mermaidEl);
}

function wireDiagram(shell) {
  var stage = buildStage(shell);
  var ctl = makeControls(stage, shell);
  /* Escape is handled once for the whole page rather than per shell, and it needs
     to put each shell's pannable state back the way its own zoom says. */
  shell.archDocsSync = ctl.sync;
  wireToolbar(stage, shell, ctl);
  wireWheel(stage.viewport, ctl);
  wirePan(stage.viewport, ctl);
  wireKeys(stage.viewport, ctl);
  markDiagramKind(shell, stage.canvas);
}

document.querySelectorAll('.diagram-shell').forEach(wireDiagram);

/* The fullscreen path gets Escape from the browser. Expand is an ordinary fixed
   overlay covering the whole viewport, and had no way out but the button that
   opened it — which is under the reader's cursor only if they remember where it
   was. Focus goes back to that button, since it is what they left. */
addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  keepingPlace(unpinDiagram);
  document.querySelectorAll('.diagram-shell.is-expanded').forEach(function (shell) {
    shell.classList.remove('is-expanded');
    var btn = shell.querySelector('[data-expand]');
    if (btn) { btn.setAttribute('aria-pressed', 'false'); btn.focus(); }
    if (shell.archDocsSync) shell.archDocsSync();
  });
});

/* LikeC4 fits a view to its box when the element boots, and only refits on
   resize. The router reveals a section before <c4-view> is upgraded, so that
   first fit is measured against a box of zero — the view then renders at its
   natural layout size and runs off the right edge of a 689px column. Nudging it
   once the element is defined is what makes it fit the column it landed in. */
/* Same treatment as the mermaid relation label, for the renderer whose DOM the
   page cannot select. LikeC4 draws div.likec4-edge-label with a translucent dark
   background in both modes, so §10 kept a chip that §12 had lost. Its shadow root
   is open, so a style element pushed inside reaches it — and because custom
   properties inherit across the shadow boundary, var(--surface) resolves against
   the host and flips with the toggle on its own.

   Every nested root, because the label is not in the one c4-view opens: that root
   holds a div which opens another. Injecting once at the top silently styles
   nothing. Styling a root before its labels exist is fine — CSS is not applied
   once. */
/* transparent, where the mermaid rule needs var(--surface): LikeC4 breaks its
   edge line around the label, so nothing has to be masked, and an opaque chip
   would read as a white blob wherever the label sits over a compound panel.
   Mermaid routes the line straight through its label and needs the mask. */
var CHIP_CSS = '.likec4-edge-label{background:transparent !important;'
  + 'color:var(--text) !important;}';

function stripEdgeChips(view) {
  var walk = function (root) {
    if (!root) return;
    if (!root.archDocsChip) {
      root.archDocsChip = 1;
      var style = document.createElement('style');
      style.textContent = CHIP_CSS;
      root.appendChild(style);
    }
    /* Descend every time, not only on first sight: the inner root is opened by a
       div this root creates later, so the walk that styles the outer one always
       runs too early to see it. */
    root.querySelectorAll('*').forEach(function (el) { walk(el.shadowRoot); });
  };
  walk(view.shadowRoot);
}

/* A shadow root cannot be observed into existence — MutationObserver does not
   cross the boundary and there is no event for "root opened". So this re-walks on
   a short ladder, which is idempotent, and again whenever the router reveals a
   page, since a hidden view defers its render until it has a box. */
function pinEdgeChips() {
  document.querySelectorAll('c4-view').forEach(stripEdgeChips);
}
window.pinEdgeChips = pinEdgeChips;

if (window.customElements) {
  customElements.whenDefined('c4-view').then(function () {
    requestAnimationFrame(function () { dispatchEvent(new Event('resize')); });
  });
  [0, 200, 600, 1500, 3000].forEach(function (t) { setTimeout(pinEdgeChips, t); });
}
</script>
</body>
</html>
