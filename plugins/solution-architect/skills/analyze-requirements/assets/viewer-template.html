<!DOCTYPE html>
<!-- data-theme="dark" in the markup: the page opens dark for everyone; the
     toggle (persisted in localStorage) can still switch it to light. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Declared, not merely implemented in CSS: the browser paints the canvas
     before the boot script runs, so without this a dark-mode reader gets a white
     flash — and the UA scrollbar and the search field's own clear button stay
     light inside a dark page. -->
<meta name="color-scheme" content="dark light">
<meta name="description" content="Architecture documentation — one self-contained page, no network.">
<!-- The rail's own mark, inline. A linked file would be a second request from a
     viewer whose whole premise is one offline file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%230f766e' stroke-width='1.6' stroke-linejoin='round'%3E%3Cpath d='M10 1.8 18 6v8l-8 4.2L2 14V6z'/%3E%3Cpath d='M10 10.2 18 6M10 10.2v8M10 10.2 2 6'/%3E%3C/svg%3E">
<title><!-- slot:TITLE --></title>
<style>
/* The two faces the stacks below name and could not rely on, embedded as base64
   woff2 by scripts/lib/fonts.mjs — nothing is fetched, and the bytes are not in
   this file. Declared first, before anything names them. */
<!-- slot:FONTS -->

/* Still no network: what the slot embeds is IBM Plex Sans and Mono, the two
   stacks whose fallback crosses a genre boundary. The display serif is left to
   the platform on purpose — Iowan → Charter → Georgia is a book serif the whole
   way down, so it degrades rather than substitutes. */
:root {
  --font-display: 'Iowan Old Style', 'Charter', 'Bitstream Charter', 'Sitka Text',
                  'Palatino Linotype', Palatino, Georgia, serif;
  --font-body: 'IBM Plex Sans', 'Source Sans 3', 'Segoe UI Variable Text', 'Segoe UI',
               Cantarell, Ubuntu, system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', 'Cascadia Code',
               'DejaVu Sans Mono', ui-monospace, monospace;

  --bg: #fbfaf7; --surface: #ffffff; --surface-2: #f4f2ec; --surface-3: #edeae1;
  --border: #e3dfd5; --border-strong: #cec8b9;
  --text: #1c1b18; --text-dim: #6b675e; --text-faint: #938f84;
  --accent: #0f766e; --accent-soft: rgba(15, 118, 110, .09); --accent-line: rgba(15, 118, 110, .35);
  --shadow: 0 1px 2px rgba(28, 27, 24, .04), 0 8px 24px -12px rgba(28, 27, 24, .12);

  /* State is its own scale, deliberately not the accent: teal already means
     "link, brand, this diagram's elements" everywhere else, and a status that
     borrows it says nothing. Ochre for a decision still open, brick for one
     rejected — both warm, so they sit in the same world as the neutrals rather
     than arriving from a UI kit. */
  --state-open: #8a5a09; --state-open-soft: rgba(138, 90, 9, .11);
  --state-stop: #a1322c; --state-stop-soft: rgba(161, 50, 44, .11);

  /* One column, one width. A diagram or a wide table used to take a 1080px
     track centred on the prose axis, which put its left edge ~190px outside
     the paragraph above it — the reader re-found the margin on every block.
     A block may now be narrower than the measure; none may be wider. */
  --rail-w: 292px; --topbar-h: 52px;
  /* 96ch, capped by the column it sits in. 74ch is the classic prose measure and
     it was too tight once every table and diagram had to live inside it — three
     of eighteen tables still cannot fit and scroll in their card. Widen this one
     value to trade reading comfort for table room.
     `100%`, not `calc(100vw - rail - 80px)`: .main is already offset by the rail
     and its own padding, so subtracting them again restates the layout in a
     second place — and 100vw counts the scrollbar gutter, which clipped ~15px
     off every block on the platforms that reserve one. It also makes the cap
     self-correcting below 960px, where the rail leaves the flow entirely. */
  --measure: min(96ch, 100%);
  /* The pinned diagram's gutter. Wide enough for a container view to stay
     readable, narrow enough that the column keeps its full measure at 1440px —
     which is why the pin is withdrawn below 1200px rather than shrunk. */
  --pin-w: 380px;
  /* One track, not two. A second `--prose` cap at 72ch was tried and reverted.
     The number is right in isolation — measured on a real set, 96ch renders
     ~108 characters a line against the 66-75 the convention asks for — but this
     document is not isolated prose. Every h2 carries a full-width rule and the
     sections are dense with full-width tables, so capping only the paragraphs
     left the text ending ~240px short of the rule above it and the table below
     it, and pushed the trailing provenance marker onto a line of its own. It
     reads as one column or it does not read as a column. To bring the line
     length down, `--measure` itself has to come down and the tables need
     somewhere else to go. */
}
/* Dark palette is applied by both the media query and the explicit attribute so
   the toggle wins in either direction. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1211; --surface: #121a19; --surface-2: #0f1716; --surface-3: #16211f;
    --border: #22302e; --border-strong: #354743;
    --text: #e9e7e1; --text-dim: #97a29e; --text-faint: #6d7772;
    --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, .12); --accent-line: rgba(45, 212, 191, .4);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -14px rgba(0, 0, 0, .7);
    --state-open: #e0b567; --state-open-soft: rgba(224, 181, 103, .15);
    --state-stop: #ef8f88; --state-stop-soft: rgba(239, 143, 136, .15);
  }
}
:root[data-theme="dark"] {
  --bg: #0c1211; --surface: #121a19; --surface-2: #0f1716; --surface-3: #16211f;
  --border: #22302e; --border-strong: #354743;
  --text: #e9e7e1; --text-dim: #97a29e; --text-faint: #6d7772;
  --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, .12); --accent-line: rgba(45, 212, 191, .4);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -14px rgba(0, 0, 0, .7);
  --state-open: #e0b567; --state-open-soft: rgba(224, 181, 103, .15);
  --state-stop: #ef8f88; --state-stop-soft: rgba(239, 143, 136, .15);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 16.5px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
  /* Belt to the braces of the single column: nothing is laid out wider than the
     measure, so a sideways page scroll can only ever be a bug. Set on body
     rather than html so it propagates to the viewport without making body a
     clipping context — an expanded diagram is position: fixed inside it. */
  overflow-x: clip;
}
::selection { background: var(--accent-soft); }

/* The same ring the buttons and the rail heads already carry, extended to the
   rest of what a keyboard reader can land on. These were falling through to the
   UA default — visible, but a different object on every platform, and this page
   has ten kinds of interactive surface. Named here rather than folded into each
   component's block so there is one place that says what focus looks like.
   Inset on the rail link, which sits in a padded well whose edge a 2px outer
   ring would collide with; outside on the rest, which have room. */
.nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.view-tab:focus-visible,
.page-chip:focus-visible,
.record-row:focus-visible,
.record-hit:focus-visible,
.help-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* One scrollbar treatment for every scroll container: the rail, a code block, a
   wide table, a tab strip. The platform default is a ~15px grey slab, which
   inside a table card is an object heavier than the hairline around it — and a
   real set has a dozen of them. */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
/* The transparent border plus content-box clip insets the thumb inside its
   gutter, so it reads as a 5px pill floating in the padding rather than a bar
   welded to the edge of the box. */
::-webkit-scrollbar-thumb {
  background: var(--border-strong); background-clip: content-box;
  border: 2px solid transparent; border-radius: 20px;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; }
::-webkit-scrollbar-corner { background: transparent; }

/* ---------- skip link ---------- */
/* DOM order is topbar, rail, prose — which is the right reading order and the
   wrong tab order: a real set puts ~120 rail links between the two, and a
   keyboard reader had to walk every one of them to reach a sentence. Parked
   above the viewport rather than clipped to a pixel, so when it takes focus it
   lands over the bar it is offering to skip. */
.skip {
  position: fixed; top: 10px; left: 10px; z-index: 200;
  padding: 9px 14px; border-radius: 8px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em;
  color: var(--bg); background: var(--accent); text-decoration: none;
  translate: 0 -300%; transition: translate .16s cubic-bezier(.2, 0, 0, 1);
}
/* :focus, not :focus-visible — a link this size is worth showing to whoever
   reaches it, however they got there. */
.skip:focus { translate: 0 0; outline: 2px solid var(--text); outline-offset: 2px; }
/* The target takes focus programmatically and should not draw a ring for it. */
.main:focus { outline: none; }

/* Micro-label: the recurring texture for every piece of metadata. */
.eyebrow {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .18em; color: var(--text-faint);
}

/* ---------- reading progress ---------- */
/* Sits on the bottom edge of the top bar rather than above it: the bar it
   belongs to is the one showing which section you are in, and the number
   beside it. Across the whole 21-document set the line barely moved. */
/* Scaled from a full-width track rather than sized by percentage: the line is
   inset by the rail, and a percentage width would resolve against the viewport
   and run off the right edge at 100%. */
#progress {
  position: fixed; top: calc(var(--topbar-h) - 2px); left: var(--rail-w); right: 0;
  height: 2px; z-index: 60; background: var(--accent);
  transform-origin: left; scale: 0 1; transition: scale .1s linear;
}

/* ---------- top bar ---------- */
.topbar {
  position: fixed; top: 0; right: 0; left: var(--rail-w); height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px; padding: 0 24px; z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.crumb {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
  color: var(--text-dim); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; flex: 1; min-width: 0;
}
.crumb b { color: var(--text); font-weight: 600; }
.crumb span { color: var(--text-faint); padding: 0 6px; }
/* Tabular figures and a fixed box: this number changes on every scroll event,
   and proportional digits would shove the theme toggle sideways as it counts. */
.route-pos {
  flex-shrink: 0; min-width: 40px; text-align: right;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em;
  font-variant-numeric: tabular-nums; color: var(--text-faint);
}

.icon-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; min-width: 32px; padding: 0 8px; flex-shrink: 0;
  background: transparent; border: 1px solid var(--border); border-radius: 8px;
  color: var(--text-dim); cursor: pointer;
  transition: color .15s, border-color .15s, background .15s,
              scale .12s cubic-bezier(.2, 0, 0, 1);
}
/* The visible chip stays 32px so the bar keeps its scale; the target is 40px.
   The topbar gap is 12px, so the extended areas never touch. */
.icon-btn::after { content: ''; position: absolute; inset: -4px; }
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.icon-btn:active { scale: .96; }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round; }
#nav-toggle { display: none; }

/* Both icons stay in the DOM and cross-fade, so the theme switch reads as one
   object turning over rather than two elements popping in and out. */
#theme-toggle { width: 32px; padding: 0; }
#theme-toggle svg {
  position: absolute; top: 50%; left: 50%; margin: -7.5px 0 0 -7.5px;
  transition: opacity .24s cubic-bezier(.2, 0, 0, 1), scale .24s cubic-bezier(.2, 0, 0, 1),
              filter .24s cubic-bezier(.2, 0, 0, 1);
}
.i-sun { opacity: 1; scale: 1; filter: blur(0px); }
.i-moon { opacity: 0; scale: .25; filter: blur(4px); }
:root[data-theme="dark"] .i-sun { opacity: 0; scale: .25; filter: blur(4px); }
:root[data-theme="dark"] .i-moon { opacity: 1; scale: 1; filter: blur(0px); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .i-sun { opacity: 0; scale: .25; filter: blur(4px); }
  :root:not([data-theme="light"]) .i-moon { opacity: 1; scale: 1; filter: blur(0px); }
  :root[data-theme="light"] .i-sun { opacity: 1; scale: 1; filter: blur(0px); }
  :root[data-theme="light"] .i-moon { opacity: 0; scale: .25; filter: blur(4px); }
}

/* ---------- rail ---------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--rail-w); z-index: 50;
  display: flex; flex-direction: column;
  background: var(--surface-2); border-right: 1px solid var(--border);
}
.rail-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.rail-mark { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.rail-mark svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--accent); }
.rail-title {
  font-family: var(--font-display); font-size: 15px; font-weight: 600; line-height: 1.25;
  letter-spacing: -.01em; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.filter-wrap { position: relative; }
.filter-wrap svg {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; fill: none; stroke: var(--text-faint); stroke-width: 1.7;
  pointer-events: none;
}
#nav-filter {
  width: 100%; height: 32px; padding: 0 10px 0 28px;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text);
  background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
  transition: border-color .15s, box-shadow .15s;
}
#nav-filter::placeholder { color: var(--text-faint); }
#nav-filter:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.rail-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 10px 12px 40px; }

.nav-chevron {
  width: 11px; height: 11px; flex-shrink: 0; color: var(--text-faint);
  transition: rotate .18s cubic-bezier(.2, 0, 0, 1);
}
.nav-sec[open] > .nav-sec__head .nav-chevron,
.nav-group[open] > .nav-group__head .nav-chevron { rotate: 90deg; }

/* Level 1 — one row per source directory. A 17-ADR run collapses to this row. */
.nav-sec + .nav-sec { margin-top: 3px; }
.nav-sec__head, .nav-group__head {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  list-style: none; user-select: none; transition: background .13s;
}
.nav-sec__head::-webkit-details-marker,
.nav-group__head::-webkit-details-marker { display: none; }
.nav-sec__head:hover, .nav-group__head:hover { background: var(--surface-3); }
.nav-sec__head:focus-visible, .nav-group__head:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px;
}
.nav-sec__head { min-height: 34px; padding: 0 9px; border-radius: 11px; }
.nav-sec__title {
  flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .16em; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-sec[open] > .nav-sec__head .nav-sec__title { color: var(--text); }
.nav-sec.is-current > .nav-sec__head .nav-sec__title { color: var(--accent); }
/* Recessed well: 11px outer radius less its 3px padding gives the 8px document
   rows inside it — concentric, so the corners nest instead of fighting. */
.nav-sec[open] > .nav-sec__body {
  margin-top: 2px; padding: 3px; border-radius: 11px;
  background: var(--bg); border: 1px solid var(--border);
}

/* Level 2 — one row per document. */
.nav-group + .nav-group { margin-top: 1px; }
.nav-group__head { min-height: 32px; padding: 6px 9px; border-radius: 8px; }
.nav-group__title {
  flex: 1; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: .005em;
  color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Tabular figures: the filter rewrites these counts live, and proportional
   digits make the whole rail twitch sideways on every keystroke. */
.nav-sec__count, .nav-group__count {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
  font-variant-numeric: tabular-nums; text-align: center; min-width: 22px;
  color: var(--text-faint); background: var(--surface-3);
  border-radius: 20px; padding: 2px 6px; flex-shrink: 0;
}
.nav-sec.is-current > .nav-sec__head .nav-sec__count,
.nav-group.is-current > .nav-group__head .nav-group__count {
  background: var(--accent-soft); color: var(--accent);
}
.nav-group.is-current > .nav-group__head .nav-group__title { color: var(--accent); }

/* Hairline spine so nested links read as one run, like an index. */
.nav-group__body { margin: 2px 0 6px; padding-left: 15px; border-left: 1px solid var(--border); }
.nav-link {
  display: block; position: relative; padding: 5px 9px; margin-left: -1px;
  border-left: 2px solid transparent; border-radius: 0 6px 6px 0;
  font-size: 12.5px; line-height: 1.4; color: var(--text-dim); text-decoration: none;
  transition: color .13s, background .13s, border-color .13s;
}
.nav-link:hover { color: var(--text); background: var(--surface-3); }
.nav-link--sub { padding-left: 20px; font-size: 11.5px; color: var(--text-faint); }
.nav-link--sub::before {
  content: ''; position: absolute; left: 9px; top: 50%; width: 5px; height: 1px;
  background: var(--border-strong);
}
.nav-link.is-active {
  color: var(--accent); background: var(--accent-soft);
  border-left-color: var(--accent); font-weight: 600;
}
.nav-empty {
  display: none; padding: 20px 10px; text-align: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
}
.sidebar.is-filtering :is(.nav-sec__count, .nav-group__count) { display: none; }
/* A document the filter promoted on its text rather than on any of its headings.
   Without the marker the reader types a phrase and gets a row whose every
   visible label lacks it, which reads as a bug in the filter. It takes the slot
   the count badge vacates while filtering, so the row keeps its shape. */
.nav-group.is-body-hit > .nav-group__head::after {
  content: 'in text'; flex-shrink: 0;
  font-family: var(--font-mono); font-size: 9px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); background: var(--accent-soft);
  border-radius: 20px; padding: 2px 6px;
}

/* One staggered reveal on load beats a dozen scattered micro-interactions. */
@keyframes rail-in { from { opacity: 0; translate: 0 6px; } to { opacity: 1; translate: 0 0; } }
.nav-sec { animation: rail-in .32s cubic-bezier(.2, 0, 0, 1) both; }
.nav-sec:nth-child(2) { animation-delay: .06s; }
.nav-sec:nth-child(3) { animation-delay: .12s; }
.nav-sec:nth-child(4) { animation-delay: .18s; }
.nav-sec:nth-child(n + 5) { animation-delay: .24s; }

.scrim { display: none; }

/* ---------- content ---------- */
.main {
  margin-left: var(--rail-w); padding: calc(var(--topbar-h) + 40px) 40px 25vh;
}
.doc { max-width: var(--measure); margin: 0 auto; }
.main :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: calc(var(--topbar-h) + 20px); }
.diagram-shell, .table-wrap { scroll-margin-top: calc(var(--topbar-h) + 20px); }

/* The document title. It used to carry a "Document 07" eyebrow and a hairline
   above it, both of which separated one document from the next in a single
   scroll. With one document on screen there is nothing above to separate it
   from, and a CSS counter cannot count pages that are not in the layout — it
   read "Document 01" on every one. The page bar carries "7 / 15" instead. */
.doc-head {
  position: relative; margin: 0 0 28px;
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(30px, 3.4vw, 43px); line-height: 1.12; letter-spacing: -.022em;
  text-wrap: balance;
}
.doc-head + p { color: var(--text-dim); font-size: 17.5px; }

/* ---------- page routes ---------- */
/* One document in the layout at a time, addressed by its own route. Sections
   are the grouping the rail shows; the page is what the reader opens. */
.doc-section[hidden], .page[hidden] { display: none; }

.main h2 {
  margin: 58px 0 18px; font-family: var(--font-display); font-weight: 600;
  font-size: 27px; line-height: 1.25; letter-spacing: -.014em;
  padding-bottom: 9px; border-bottom: 1px solid var(--border);
}
/* h3 was 16px against 16.5px body text, so sub-sections read as bold
   paragraphs. It has to outrank the prose to be a level at all. */
.main h3 {
  margin: 40px 0 12px; font-family: var(--font-display);
  font-size: 19.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.008em;
  color: var(--text);
}
.main h4, .main h5, .main h6 {
  margin: 28px 0 8px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .11em; color: var(--text-dim);
}
.main :is(h2, h3) + p, .main :is(h4, h5, h6) + p { margin-top: 0; }
/* One line of air between paragraphs; anything less and the column reads as a
   single block with bold interruptions. */
.main p { margin: 0 0 24px; text-wrap: pretty; }
/* Underline with an offset instead of a border: the border sat on the
   descenders of g, y and p in every inline link. */
.main a {
  color: var(--accent); text-decoration: underline;
  text-decoration-color: var(--accent-line); text-decoration-thickness: 1px;
  text-underline-offset: .18em; transition: text-decoration-color .15s;
}
.main a:hover { text-decoration-color: var(--accent); }
/* Block links — index rows, search hits, page-bar chips — are surfaces, not
   words in a sentence. `.main a` outranks a bare class, so they have to be named
   against it or every one of them grows a prose underline. */
.main :is(.record-row, .record-hit, .page-chip) { text-decoration: none; }

/* Landing from a deep link in a 21-document page gives no sense of arrival.
   The mark fades but the rule stays until the reader moves on. */
@keyframes landed { from { background: var(--accent-soft); } to { background: transparent; } }
.main :is(h2, h3):target {
  animation: landed 1.6s cubic-bezier(.2, 0, 0, 1) both;
  box-shadow: -14px 0 0 -12px var(--accent);
}

/* Hover-revealed deep link — this is a reference document people cite. */
.anchor {
  position: absolute; left: -1.05em; width: 1em; text-align: center;
  border: none !important; color: var(--text-faint) !important;
  opacity: 0; transition: opacity .13s; font-weight: 400;
}
.main :is(h2, h3):hover .anchor, .anchor:focus-visible { opacity: 1; }
.main :is(h2, h3) {
  position: relative;
  text-wrap: balance;
}

/* The section explains the system; this explains the section. Click, not hover:
   the text is too long for a tooltip, and a hover-only control is unreachable
   from a keyboard and on a touch screen. */
.help-btn {
  position: relative; margin-left: .4em; padding: 0;
  width: 1.15em; height: 1.15em; vertical-align: .06em;
  border: 1px solid var(--border); border-radius: 50%;
  background: none; color: var(--text-faint);
  font: 600 .62em/1.15 var(--font-body); cursor: pointer;
  transition: color .13s, border-color .13s;
}
.help-btn:hover { color: var(--text); border-color: var(--text-faint); }
.help-btn::after { content: ''; position: absolute; inset: -12px; }
.help-btn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
details.help { margin: 0 0 18px; }
details.help > summary { display: none; }
.help__body {
  border-left: 2px solid var(--border); padding: 2px 0 2px 14px;
  color: var(--text-dim); font-size: .94em;
}
.help__body p { margin: 0 0 6px; }
.help__body b { color: var(--text); font-weight: 600; }

code {
  font-family: var(--font-mono); font-size: .855em;
  background: var(--surface-3); border-radius: 4px; padding: .1em .38em;
  color: var(--text); word-break: break-word;
}
/* The prose chip is sized for 16.5px body text. On a display heading it
   becomes a grey box heavier than the words beside it — keep the monospace,
   drop the container. */
:is(.doc-head, .main h2, .main h3) code {
  background: none; padding: 0; font-size: .82em; font-weight: inherit;
}
/* Strict `pre`, not `pre-wrap`: these blocks carry directory trees whose
   ├── └── │ connectors only line up while the source line breaks are the only
   line breaks. Long lines scroll sideways instead of reflowing. */
pre {
  font-family: var(--font-mono); font-size: 12.8px; line-height: 1.62;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 18px; margin: 24px 0; max-height: 30rem; overflow: auto;
  white-space: pre; box-shadow: var(--shadow);
}
pre code { white-space: inherit; background: none; padding: 0; font-size: inherit; }
blockquote {
  margin: 24px 0; padding: 14px 18px; border-left: 2px solid var(--accent);
  border-radius: 0 8px 8px 0; background: var(--surface-2); color: var(--text-dim);
}
blockquote > :last-child { margin-bottom: 0; }
hr { border: none; height: 1px; background: var(--border); margin: 48px 0; }

/* ---------- tables ---------- */
/* The card hugs its table up to the column and no further: a 3x15 index needing
   523px stays 523px wide, and a 15-column risk register stops at the measure
   and scrolls inside itself. */
.table-wrap {
  margin: 22px 0; border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; background: var(--surface); box-shadow: var(--shadow);
  width: 100%;
}
/* The height is what makes the sticky header below work at all. `overflow-x:
   auto` computes the other axis from `visible` to `auto` — the same rule the tab
   bar's own comment records — so this box is a scrollport on both axes. Left
   unbounded it never scrolls vertically, the header sticks to a box that cannot
   move, and a 40-row table scrolls its own column labels away under the top bar.
   Capped, a tall table scrolls inside its card the way a long `pre` already does. */
.table-scroll {
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  max-height: min(70vh, 40rem);
}
/* One width for every table, because content width gave each one its own and a
   page of them read as a ragged right edge against a fixed prose column. The cap
   stays: full width is a floor too, and without a ceiling a wide table pushes
   past the column instead of wrapping its cells — 15 of the 18 tables in a real
   set grew their own sideways scrollbar inside a vertical read. */
table {
  border-collapse: collapse; width: 100%; max-width: 100%;
  font-size: 13.5px; line-height: 1.55;
}
th {
  position: sticky; top: 0; z-index: 1; text-align: left;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .13em; color: var(--text-dim);
  background: var(--surface-2); padding: 11px 15px;
  border-bottom: 1px solid var(--border-strong);
}
td {
  padding: 11px 15px; border-bottom: 1px solid var(--border); vertical-align: top;
  font-variant-numeric: tabular-nums;
}
/* Seven or more columns in an 891px measure is ~110px each, which is narrower
   than the words going into it. Tried `overflow-wrap: anywhere` first — it does
   remove the sideways scroll, because it is the only value min-content sizing
   reads, but it breaks every cell mid-word ("TypeScri pt", "obs erv ed") and a
   table nobody can read is worse than one that scrolls. A tighter scale buys the
   columns real width instead, and md-render.mjs marks the table that needs it. */
.table--wide { font-size: 12px; }
.table--wide :is(th, td) { padding: 9px 11px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .13s; }
tbody tr:hover { background: var(--surface-2); }
td code { background: var(--accent-soft); color: var(--accent); font-size: 11.5px; }

ul, ol { margin: 0 0 24px; padding-left: 1.4em; }
li { margin-bottom: 8px; }
li:last-child { margin-bottom: 0; }
li > :is(ul, ol) { margin: 8px 0 0; }
li::marker { color: var(--text-faint); }

/* ---------- definition grids ---------- */
/* A two-column table whose right column runs to prose is a definition list, and
   19 rows of hairline dividers is the worst way to show one. Cards stay at the
   prose measure: the win here is scanning, not height, and a third column would
   cost the reading edge. */
.def-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px; margin: 22px 0;
}
.def {
  padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); transition: border-color .15s, background .15s;
}
.def:hover { border-color: var(--border-strong); background: var(--surface-2); }
.def dt {
  margin-bottom: 6px; font-family: var(--font-display); font-size: 15px;
  font-weight: 600; letter-spacing: -.006em; color: var(--text); text-wrap: balance;
}
.def dd {
  margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-dim); text-wrap: pretty;
}
.def dd code { font-size: 12px; }

/* A wide table with two or three rows (§9 External Integrations is eight columns
   describing one integration) is a record, not a comparison, and md-wide.mjs
   turns it sideways. One card per row: the first column names it, the rest are
   label/value pairs stacked so a long value has the whole column to wrap in
   instead of a 1/8th cell. Two columns of pairs above 640px, one below. */
.rec-cards { display: grid; gap: 12px; margin: 22px 0; }
.rec-card {
  padding: 16px 18px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow);
}
.rec-card__name {
  margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
  font-family: var(--font-display); font-size: 16px; font-weight: 600;
  letter-spacing: -.008em; color: var(--text);
}
.rec-card__fields {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px 24px; margin: 0;
}
.rec-field dt {
  margin-bottom: 3px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-faint);
}
.rec-field dd {
  margin: 0; font-size: 14px; line-height: 1.6; color: var(--text); text-wrap: pretty;
}
.rec-field dd code { font-size: 12px; }

/* A reference to a file the viewer does not contain. Rendered as text rather
   than a link that goes nowhere; mono marks it as a path without borrowing the
   link colour and promising a destination. */
.ext-ref {
  font-family: var(--font-mono); font-size: .88em; color: var(--text-dim);
  border-bottom: 1px dotted var(--border-strong);
}

/* ---------- view tabs ---------- */
.view-tabs { margin: 26px 0; }
/* overflow-y: hidden is not decoration. overflow-x: auto computes the other
   axis from visible to auto, so the bar grew a vertical scrollbar — arrows and
   all — for the 5px its tabs' hit areas stuck out of a 3px padding. */
.view-tabs__bar {
  display: flex; gap: 2px; padding: 5px; margin-bottom: 10px;
  overflow-x: auto; overflow-y: hidden;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px;
}
/* 13px bar radius less its 5px padding gives 8px tabs — concentric, so the
   selected chip nests instead of fighting the corner it sits in. */
.view-tab {
  position: relative; flex: 0 0 auto; height: 30px; padding: 0 13px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: .04em; color: var(--text-dim); white-space: nowrap;
  background: transparent; border: none; border-radius: 8px; cursor: pointer;
  transition: color .15s, background .15s, scale .12s cubic-bezier(.2, 0, 0, 1);
}
/* 30px chip, 40px target. Extended vertically only, so neighbours 2px apart
   never overlap. */
.view-tab::after { content: ''; position: absolute; inset: -5px 0; }
.view-tab:hover { color: var(--text); }
.view-tab:active { scale: .96; }
.view-tab[aria-selected="true"] {
  color: var(--text); background: var(--surface);
  box-shadow: 0 1px 2px rgb(0 0 0 / .07), 0 0 0 1px var(--border);
}
.view-panel[hidden] { display: none; }
/* Vertical margins only: the shorthand would also reset the breakout's negative
   left margin, pushing a 1068px diagram off the right edge of the viewport. */
.view-tabs .diagram-shell { margin-top: 0; margin-bottom: 0; }

/* The page bar sits above the document's title, so the scroll target has to be
   the page, not its heading, or prev/next lands off screen. */
.page { scroll-margin-top: calc(var(--topbar-h) + 20px); }
.page-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 28px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.page-chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 11px; flex-shrink: 0;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .11em;
  color: var(--text-dim); text-decoration: none; cursor: pointer;
  background: transparent; border: 1px solid var(--border); border-radius: 8px;
  transition: color .15s, border-color .15s, background .15s,
              scale .12s cubic-bezier(.2, 0, 0, 1);
}
.page-chip::after { content: ''; position: absolute; inset: -5px 0; }
.page-chip:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.page-chip:active { scale: .96; }
.page-chip[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.page-pos {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .11em;
  font-variant-numeric: tabular-nums; color: var(--text-faint);
}
.page-steps { display: flex; gap: 6px; margin-left: auto; }

/* ---------- index pages ---------- */
.record-summary {
  margin: 0 0 18px; font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  font-variant-numeric: tabular-nums; color: var(--text-faint);
}
/* The generated list, shown only when the author's own index does not link every
   record. Rows rather than cards: this is an index of 15 things, and the reader
   is scanning one column of titles for a name they already half-remember. */
.record-list { display: grid; gap: 4px; margin: 0 0 28px; }
.record-list > .eyebrow { margin-bottom: 4px; }
.record-row {
  display: grid; grid-template-columns: 2.4em 1fr auto; align-items: baseline; gap: 12px;
  padding: 10px 13px; text-decoration: none; color: inherit;
  border: 1px solid transparent; border-radius: 9px;
  transition: border-color .15s, background .15s;
}
.record-row:hover { border-color: var(--border); background: var(--surface); }
.record-row__n {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  font-variant-numeric: tabular-nums; color: var(--text-faint);
}
.record-row b { font-size: 14.5px; font-weight: 600; color: var(--text); text-wrap: pretty; }
/* Accepted is the quiet default — most records are settled, and colouring the
   majority tells the reader nothing. What earns a colour is a decision still open
   and one that was rejected. Superseded is struck rather than tinted: the point is
   not severity, it is "this is no longer the answer", and a line says that where a
   third hue would just be a third hue. An absent status gets an outline, because
   nothing was recorded and a filled pill would claim a value. */
.record-row__s {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim);
  background: var(--surface-3); border: 1px solid transparent;
  border-radius: 20px; padding: 3px 8px; white-space: nowrap;
}
.record-row__s[data-status="proposed"],
.record-row__s[data-status="draft"] {
  color: var(--state-open); background: var(--state-open-soft);
}
.record-row__s[data-status="rejected"] {
  color: var(--state-stop); background: var(--state-stop-soft);
}
.record-row__s[data-status="superseded"],
.record-row__s[data-status="deprecated"] {
  color: var(--text-faint); text-decoration: line-through;
}
.record-row__s[data-status="unrecorded"] {
  color: var(--text-faint); background: none; border-color: var(--border-strong);
  border-style: dashed;
}

/* The four provenance words are a closed vocabulary, not code. They used to
   render as <code>, which put them in accent teal — the same chip as `org_id` —
   so the most repeated element in the set read as a snippet. Small caps in the
   utility face, no fill: a footnote about where the sentence came from, sitting
   beside the sentence rather than competing with it. */
.prov {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint);
  border: 1px solid var(--border); border-radius: 3px; padding: .15em .4em;
  vertical-align: .1em; white-space: nowrap;
}
.prov[data-prov="proposed"] { color: var(--state-open); border-color: var(--state-open-soft); }
.prov[data-prov="assumed"] { color: var(--state-stop); border-color: var(--state-stop-soft); }

/* Hiding the records takes them out of reach of the browser's own find, so the
   index searches their text directly. They are still in the DOM — only hidden —
   so this reads the same characters Ctrl+F would have, and can say which
   record matched instead of dropping the reader into an unlabelled slab. */
.record-search { margin: 0 0 14px; }
.record-search input {
  width: 100%; height: 40px; padding: 0 14px;
  font-family: var(--font-body); font-size: 14px; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  transition: border-color .15s, box-shadow .15s;
}
.record-search input::placeholder { color: var(--text-faint); }
.record-search input:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.record-empty {
  margin: 0; padding: 16px 14px; text-align: center;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint);
  background: var(--surface-2); border: 1px dashed var(--border-strong);
  border-radius: 9px;
}
.record-hits { display: grid; gap: 6px; margin: 0 0 24px; }
.record-hits:empty { margin: 0; }
.record-hit {
  display: block; padding: 11px 14px; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  transition: border-color .15s, background .15s;
}
.record-hit:hover { border-color: var(--accent-line); background: var(--surface-2); }
.record-hit b {
  display: block; margin-bottom: 3px; font-size: 14px; font-weight: 600; color: var(--text);
}
.record-hit span { font-size: 12.5px; line-height: 1.55; color: var(--text-dim); }
.record-hit mark {
  background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 2px;
}

/* ---------- diagrams ---------- */
.diagram-shell {
  position: relative; margin: 26px 0; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow);
}
.diagram-shell:fullscreen { width: 100vw; height: 100vh; margin: 0; border: none;
  border-radius: 0; background: var(--bg); }
.diagram-toolbar {
  position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; gap: 1px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border); border-radius: 8px; padding: 3px;
}
.diagram-toolbar button {
  display: inline-flex; align-items: center; justify-content: center;
  width: 27px; height: 27px; padding: 0; border: none; background: transparent;
  color: var(--text-dim); cursor: pointer; border-radius: 5px;
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .02em;
  transition: background .13s, color .13s;
}
/* The one control carrying a value rather than an icon. Tabular figures and a
   floor on the width, because it rewrites on every zoom step and proportional
   digits would shove the three buttons beside it sideways as it counted. */
.diagram-toolbar [data-zoom-reset] {
  width: auto; min-width: 38px; padding: 0 6px;
  font-variant-numeric: tabular-nums;
}
.diagram-toolbar button:hover { background: var(--surface-3); color: var(--text); }
.diagram-toolbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.diagram-toolbar svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.diagram-toolbar [data-exit-fullscreen] { display: none; }
.diagram-shell:fullscreen [data-exit-fullscreen] { display: inline-flex; }
.diagram-viewport {
  overflow: hidden; min-height: 320px; display: flex; align-items: center;
  justify-content: center; padding: 20px;
}
.diagram-shell:fullscreen .diagram-viewport { height: 100vh; }
.diagram-viewport:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Panning is offered only once there is something to pan — zoomed in, expanded,
   or fullscreen. Two reasons it is a state rather than the default: at 1:1 the
   whole diagram is already in the box, so a grab cursor promises movement that
   cannot happen; and `touch-action: none` there would swallow the page scroll of
   any reader whose finger lands on a diagram on the way down the document. */
.diagram-viewport.is-pannable { cursor: grab; touch-action: none; }
.diagram-viewport.is-pannable.is-panning { cursor: grabbing; user-select: none; }
.diagram-canvas { transform-origin: center; }
.diagram-shell.is-expanded {
  position: fixed; inset: 20px; width: auto; margin: 0; z-index: 100;
  box-shadow: 0 24px 70px -18px rgba(0, 0, 0, .5);
}
.diagram-shell.is-expanded .diagram-viewport { height: calc(100% - 12px); }

/* ---------- pinning ---------- */
/* Diagrams are what an architecture set is for, and they sit inline: scrolling
   to the paragraph explaining a container scrolls the container view off the
   screen, so the reader holds it in their head or scrolls back. Expand and
   fullscreen both answer a different question — they cover the prose.
   A pin docks the diagram in its own gutter and leaves the column readable. */
.diagram-shell.is-pinned {
  position: fixed; z-index: 90; margin: 0;
  top: calc(var(--topbar-h) + 16px); right: 16px; bottom: 16px;
  width: var(--pin-w);
  display: flex; flex-direction: column;
  box-shadow: 0 24px 70px -18px rgba(0, 0, 0, .5);
}
/* min-height: 0 because the viewport carries its own 320px floor, which in a
   flex column is a floor on the item too — the pane would overflow its own
   bottom edge on a short window instead of the diagram shrinking. */
.diagram-shell.is-pinned .diagram-viewport { flex: 1; min-height: 0; }
/* The pane is fixed, so it is out of flow and cannot push anything. Without a
   reserved gutter it sits over the column it was pinned to be read beside. */
body.has-pin .main { padding-right: calc(var(--pin-w) + 56px); }
/* Holds the height the shell had, so taking it out of the flow does not shorten
   the document under a reader whose scroll offset the browser is keeping. */
.diagram-slot { margin: 26px 0; }

/* A diagram mermaid could not parse. Named as a failure rather than left to show
   its own source: an unhandled render puts a slab of DSL inside a diagram frame,
   which reads as a code block somebody meant to put there. Brick, because this is
   the same "something is wrong" the rejected-status pill means. */
.diagram-error {
  margin: 0; padding: 16px 18px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.6;
  color: var(--state-stop); background: var(--state-stop-soft);
  border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere;
}

/* LikeC4 fits its view to the box it is given. Without an explicit one the
   webcomponent collapses to a thumbnail in the middle of an empty shell. */
.diagram-shell.is-c4 .diagram-canvas,
.diagram-shell.is-mermaid .diagram-canvas { width: 100%; }
.diagram-shell.is-mermaid .mermaid-canvas { display: flex; justify-content: center; }
.diagram-shell.is-c4 .diagram-viewport { padding: 0; }

/* A relation label is a word on a line, not a component. Mermaid draws it as an
   opaque chip and locks its text to primaryTextColor — the light ink solid teal
   fills need — so every chip it can paint has to be dark to stay legible, which
   on a cream page is a dark blob. No theme variable can say "no chip".
   Mermaid's SVG is in the page's own DOM, unlike LikeC4's shadow root, so the
   viewer takes the label back: the page surface behind it (which masks the line
   the label sits on — transparent would let it strike through the text) and the
   page's own ink in front. Both already flip with the theme, so there is no
   per-mode hex left to state. `!important` because mermaid injects its own
   rules into the SVG and wins on specificity otherwise.

   All three layers, because mermaid paints the chip on a different one per
   diagram type: the ER label colours the wrapping div, the flowchart label the
   innermost paragraph. Miss one and that diagram type keeps its blob. */
.diagram-canvas .labelBkg,
.diagram-canvas span.edgeLabel,
.diagram-canvas span.edgeLabel p {
  background-color: var(--surface) !important;
  color: var(--text) !important;
}
c4-view { display: block; width: 100%; height: 460px; }
.diagram-shell.is-c4:fullscreen c4-view,
.diagram-shell.is-c4.is-expanded c4-view { height: 100%; }

/* ---------- record drawer ---------- */

/* §14 Decisions already tables every ADR, so a Decision Records rail section was
   the same set a second time — and the reader was looking at §14 when they
   clicked, so replacing the page threw away the row they came from. A record opens
   over it instead, and closing puts them back exactly where they were with no
   scroll to re-find. */
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 120;
  display: flex; flex-direction: column;
  width: min(720px, 100%); background: var(--bg);
  border-left: 1px solid var(--border);
  box-shadow: -24px 0 60px -20px rgba(0, 0, 0, .35);
  transform: translateX(100%); transition: transform .26s cubic-bezier(.2, 0, 0, 1);
  /* Not display:none when shut: a panel that pops in has no direction, and the
     slide is what says "this is over the page, not instead of it". */
  visibility: hidden;
}
#drawer.is-open { transform: translateX(0); visibility: visible; }
.drawer-scrim {
  position: fixed; inset: 0; z-index: 110; background: rgba(12, 18, 17, .38);
  opacity: 0; pointer-events: none; transition: opacity .26s;
}
.drawer-scrim.is-open { opacity: 1; pointer-events: auto; }
.drawer__bar {
  display: flex; align-items: center; gap: 12px; flex: none;
  height: var(--topbar-h); padding: 0 12px 0 22px;
  border-bottom: 1px solid var(--border); background: var(--surface-2);
}
/* Names the record, does not repeat its title. The bar carried the whole 90-char
   ADR heading in 10.5px uppercase letter-spaced mono — an eyebrow treatment
   applied to a paragraph — while the H1 two lines below said the same thing. */
.drawer__label {
  font-family: var(--font-mono); font-size: 10.5px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .13em;
  color: var(--text-dim); white-space: nowrap;
}
.drawer__bar #drawer-status { margin-right: auto; }
.drawer__body { flex: 1; overflow-y: auto; padding: 30px 34px 60px; }
/* The record is the whole panel, so it drops the page's own measure: 720px of
   drawer capped at 96ch would leave the text in a column of its own inside it. */
.drawer__body .page { max-width: none; }
.drawer__body .doc-head { margin-top: 0; }
@media (max-width: 760px) {
  .drawer__body { padding: 22px 20px 48px; }
}

/* ---------- responsive ---------- */
/* Above this the column keeps its 96ch beside a 380px pane; below it, one of the
   two has to give, and a diagram squeezed into 240px is not a diagram. The
   control is withdrawn rather than shrunk — and a pin already taken before a
   resize is released, or it stays welded to a viewport with no gutter left. */
@media (max-width: 1200px) {
  .diagram-toolbar [data-pin] { display: none; }
  .diagram-shell.is-pinned {
    position: relative; inset: auto; width: auto; margin: 26px 0;
    display: block; box-shadow: var(--shadow);
  }
  .diagram-slot { display: none; }
  body.has-pin .main { padding-right: 40px; }
}
/* No narrow-desktop breakpoint, and no --measure override below either: the
   measure resolves against the column the rail has already left, so it gives up
   width on its own before the 96ch cap ever binds. */
@media (max-width: 960px) {
  :root { --rail-w: 300px; }
  .topbar { left: 0; padding: 0 14px; }
  #progress { left: 0; }
  .route-pos { min-width: 0; letter-spacing: .06em; }
  #nav-toggle { display: inline-flex; }
  .sidebar {
    transform: translateX(-100%); transition: transform .26s cubic-bezier(.4, 0, .2, 1);
    box-shadow: none;
  }
  .sidebar.is-open { transform: translateX(0); box-shadow: 0 0 60px rgba(0, 0, 0, .3); }
  .scrim {
    display: block; position: fixed; inset: 0; z-index: 45; background: rgba(10, 12, 12, .5);
    opacity: 0; pointer-events: none; transition: opacity .26s;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .scrim.is-open { opacity: 1; pointer-events: auto; }
  .main { margin-left: 0; padding: calc(var(--topbar-h) + 26px) 18px 20vh; }
  .doc-head { font-size: clamp(26px, 7vw, 34px); }
  .main h2 { font-size: 21px; margin-top: 40px; }
  body { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important; transition-duration: .01ms !important;
  }
}
@media print {
  .sidebar, .topbar, .scrim, #progress, .diagram-toolbar,
  .skip, .drawer-scrim, .drawer__bar, .page-bar { display: none; }
  .main { margin: 0; padding: 0; }
  /* Paper has no viewport to pin against: a fixed pane prints once, over page
     one, and the place it was pinned from prints as a gap. Back in the flow. */
  .diagram-shell.is-pinned {
    position: static; inset: auto; width: auto; margin: 26px 0;
    display: block; box-shadow: none;
  }
  .diagram-slot { display: none; }
  /* The cap that lets the sticky header work is a screen affordance. Paper has
     no scrollport, so a table taller than it would simply lose its last rows.
     (`pre` carries a 30rem cap with the same consequence — untouched here
     because it predates this rule and is its own call.) */
  .table-scroll { max-height: none; overflow: visible; }
  /* Printing printed whichever document the router had in the layout — one of
     twenty-one, and inside a routed section one record of fifteen. Paper has no
     router and every page is already in the DOM, only hidden, so it can have the
     whole set. Which is what somebody printing an architecture document meant. */
  .doc-section[hidden], .page[hidden] { display: block; }
  /* An open record has been moved into the drawer, so it prints from there or
     not at all. Static rather than the fixed panel it is on screen: in flow it
     lands at the end of the set instead of over the first page of it. */
  #drawer {
    position: static; transform: none; visibility: visible;
    width: auto; border: none; box-shadow: none;
  }
  .drawer__body { overflow: visible; padding: 0; }
  /* A control on paper is a control nobody can press. The panel is a closed
     <details> and prints closed, which leaves the document as authored — but
     the <details> itself still carries its margin, so it must hide too or
     every heading leaves a blank box the height of a collapsed panel. */
  .help-btn, details.help { display: none; }
}
</style>
</head>
<body>
<script>
/* Guarded, because this runs before the body paints and localStorage is not
   always readable: blocked site data throws SecurityError, and so does a
   file:// origin in some browsers — which is exactly how a single-file offline
   viewer gets opened. Unguarded, the throw takes the theme and every script
   after it, so the page renders in the wrong mode or not at all. Losing the
   stored preference is the correct failure; losing the page is not. */
(function () {
  var stored = null;
  try { stored = localStorage.getItem('arch-docs-theme'); } catch (e) { /* no store */ }
  if (stored) document.documentElement.setAttribute('data-theme', stored);
})();
</script>

<a class="skip" href="#main-content">Skip to content</a>

<div id="progress"></div>

<header class="topbar">
  <button class="icon-btn" id="nav-toggle" type="button" aria-label="Toggle navigation"
          aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
  </button>
  <div class="crumb" id="crumb"></div>
  <span class="route-pos" id="route-pos" aria-live="off"
        title="How far through this section you have read"></span>
  <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark and light theme">
    <svg class="i-sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.6v2M10 16.4v2M3.1 3.1l1.4 1.4M15.5 15.5l1.4 1.4M1.6 10h2M16.4 10h2M3.1 16.9l1.4-1.4M15.5 4.5l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 20 20"><path d="M17.3 11.1A7.6 7.6 0 0 1 8.9 2.7a7.6 7.6 0 1 0 8.4 8.4z"/></svg>
  </button>
</header>

<div class="scrim" id="scrim"></div>

<nav class="sidebar" id="sidebar" aria-label="Document sections">
  <div class="rail-head">
    <div class="rail-mark">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M10 1.8 18 6v8l-8 4.2L2 14V6z"/><path d="M10 10.2 18 6M10 10.2v8M10 10.2 2 6"/>
      </svg>
      <div class="rail-title" id="rail-title"></div>
    </div>
    <div class="filter-wrap">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4"/><path d="m10.4 10.4 3.1 3.1"/></svg>
      <input id="nav-filter" type="search" placeholder="Filter sections…"
             autocomplete="off" spellcheck="false" aria-label="Filter sections">
    </div>
  </div>
  <div class="rail-scroll" id="rail-scroll">
    <!-- slot:NAV -->
    <div class="nav-empty" id="nav-empty">No matching sections</div>
  </div>
