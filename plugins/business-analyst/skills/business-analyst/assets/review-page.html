<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--@TITLE@--></title>
<style>
/* Read-only: the PO's own document, re-drawn from requirements.json. Rows the interview added are tinted. */
:root {
  --bg: #ffffff; --ink: #1a1d21; --muted: #5c6470; --line: #d9dde3; --accent: #0f5c5a; --wash: #f6f7f9;
  --box: #fbfcfd; --box-line: #44586a; --fl-paper: #e8ecef; --fl-line: #5d6c78; --fl-ink: #141c24; --new-bg: #fff6d6; --new-line: #e3b341;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171c; --ink: #e6ecf1; --muted: #93a3b0; --line: #2c3740; --accent: #5fb8b2; --wash: #161d23;
  --box: #1a2229; --box-line: #8fa8bb; --fl-paper: #11171c; --fl-line: #93a3b0; --fl-ink: #e6ecf1; --new-bg: #3a2f0b; --new-line: #bb8009; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11171c; --ink: #e6ecf1; --muted: #93a3b0; --line: #2c3740; --accent: #5fb8b2; --wash: #161d23;
  --box: #1a2229; --box-line: #8fa8bb; --fl-paper: #11171c; --fl-line: #93a3b0; --fl-ink: #e6ecf1; --new-bg: #3a2f0b; --new-line: #bb8009; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 52rem; margin: 0 auto; padding: 3rem 16px 5rem; }
h1 { font-size: 1.9rem; line-height: 1.25; letter-spacing: -.01em; margin: 0 0 .4rem; }
.byline { color: var(--muted); margin: 0 0 .3rem; }
.summary { color: var(--muted); font-size: .9rem; margin: 0 0 1.6rem; }
h2 { font-size: 1.25rem; margin-top: 2.6rem; padding-top: 1.2rem; border-top: 1px solid var(--line); color: var(--accent); }
h2 .sysno { color: var(--muted); font-weight: 500; }
p { max-width: 68ch; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; line-height: 1.5; padding: 0 6px; border-radius: 4px; background: var(--new-bg); border: 1px solid var(--new-line); color: var(--ink); }
table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td:first-child { font-weight: 600; width: 34%; }
tr.new td, li.new { background: var(--new-bg); }
tr.new td:first-child { box-shadow: inset 3px 0 var(--new-line); }
.src { display: block; font-size: .78rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
ul { padding-left: 20px; }
li { margin: 4px 0; }
li.new { list-style: none; margin-left: -20px; padding: 6px 10px 6px 17px; border-left: 3px solid var(--new-line); border-radius: 0 4px 4px 0; }
/* Diagrams use the estimate page's style, so a workflow looks the same in every phase:
   grey panel, square white boxes, thin grey arrows; solid for the main flow, dotted for a branch. */
.flow { overflow-x: auto; margin: 0 0 1rem; padding: 16px; background: var(--fl-paper); border: 1px solid var(--line); }
.flow-name { font-size: .85rem; font-weight: 600; color: var(--muted); margin: 1.2rem 0 .3rem; }
.grid { display: grid; grid-auto-columns: max-content; justify-items: center; align-items: center; column-gap: 0; width: max-content; }
.step { background: var(--box); border: 1px solid var(--box-line); border-radius: 0; padding: 7px 14px; font: 12px/1.35 system-ui, sans-serif; color: var(--fl-ink); text-align: center; max-width: 160px; }
.grid > .step { justify-self: stretch; }
.grid > .step:not(.alt):not(.back):not(.wide) { max-width: 172px; }
.grid > .step.wide { max-width: none; }
.step.alt, .step.back, .down { margin: 0 6px; }
.step.back { color: var(--muted); }
/* Main flow: thin solid line, small filled head touching the next box. The "→" text stays for screen readers. */
.arrow { justify-self: stretch; display: flex; align-items: center; min-width: 36px; font-size: 0; }
.arrow::before { content: ""; flex: 1; height: 1px; background: var(--fl-line); }
.arrow::after { content: ""; border: 4px solid transparent; border-right: 0; border-left-width: 7px; border-left-color: var(--fl-line); }
/* Branch: thin dotted line top to bottom, the PO's label sitting on it, same head touching the box below. */
.down { justify-self: stretch; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 52px; padding: 14px 0 18px; text-align: center; font: 11px/1.3 system-ui, sans-serif; color: var(--muted); }
.down::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 7px; width: 1px; background: repeating-linear-gradient(to bottom, var(--fl-line) 0 3px, transparent 3px 6px); }
.down::after { content: ""; position: absolute; left: calc(50% - 3.5px); bottom: 0; border: 4px solid transparent; border-bottom: 0; border-top-width: 7px; border-top-color: var(--fl-line); }
.lbl { position: relative; max-width: 160px; padding: 1px 6px; background: var(--fl-paper); }
</style>
</head>
<body>
<main>
<!--@BODY@-->
</main>
</body>
</html>
